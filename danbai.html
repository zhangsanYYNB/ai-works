<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>单摆模型的变形拓展 · 3D 物理教学</title>
<style>
:root { font-family: 'Segoe UI', Tahoma, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
* { box-sizing: border-box; }
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
body[data-theme="dark"] {
    --bg: #050812;
    --card: rgba(10, 18, 36, 0.78);
    --card-solid: rgba(10, 18, 36, 0.92);
    --ink: #eaf3ff;
    --ink-soft: #9db4d6;
    --line: rgba(140, 190, 255, 0.18);
    --accent: #5ee7ff;
    --accent-2: #8b9cff;
    --tab-bg: rgba(255, 255, 255, 0.05);
    --tab-active: linear-gradient(135deg, #2f8cff, #6ee7ff);
    --info: rgba(94, 231, 255, 0.10);
    --danger: #ff8a80;
    --shadow: 0 24px 70px rgba(0, 0, 0, 0.52);
}
body[data-theme="light"] {
    --bg: #eaf1f8;
    --card: rgba(255, 255, 255, 0.86);
    --card-solid: rgba(255, 255, 255, 0.96);
    --ink: #1f2d3d;
    --ink-soft: #5d6d7e;
    --line: rgba(44, 62, 80, 0.14);
    --accent: #1677c8;
    --accent-2: #5a6fd8;
    --tab-bg: rgba(255, 255, 255, 0.72);
    --tab-active: linear-gradient(135deg, #2f8cff, #5ee7ff);
    --info: rgba(52, 152, 219, 0.10);
    --danger: #c0392b;
    --shadow: 0 20px 50px rgba(44, 62, 80, 0.16);
}
body { background: var(--bg); color: var(--ink); transition: background 0.35s, color 0.35s; }
body[data-theme="dark"] #stage { background: radial-gradient(circle at 42% 34%, #1b2f55 0%, #0b142b 46%, #050812 100%); }
body[data-theme="light"] #stage { background: radial-gradient(circle at 42% 34%, #ffffff 0%, #eef4fa 48%, #dbe7f2 100%); }
#stage { position: fixed; inset: 0; overflow: hidden; }
#stage canvas { position: absolute; inset: 0; display: block; width: 100% !important; height: 100% !important; touch-action: none; }
.topbar {
    position: fixed;
    top: 16px;
    left: 16px;
    right: 376px;
    z-index: 10;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    padding: 12px 16px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
}
.brand h1 { margin: 0; font-size: 18px; letter-spacing: 0.5px; }
.brand p { margin: 3px 0 0; font-size: 11px; color: var(--ink-soft); }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
.tab {
    padding: 8px 13px;
    border: 1px solid var(--line);
    background: var(--tab-bg);
    color: var(--ink);
    border-radius: 999px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    transition: transform 0.2s, background 0.2s, color 0.2s;
}
.tab:hover { transform: translateY(-1px); border-color: var(--accent); }
.tab.active { background: var(--tab-active); color: #fff; border-color: transparent; box-shadow: 0 6px 18px rgba(47, 140, 255, 0.35); }
.icon-btn {
    padding: 8px 12px;
    border: 1px solid var(--line);
    background: var(--tab-bg);
    color: var(--ink);
    border-radius: 999px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
}
.icon-btn:hover { border-color: var(--accent); }
.hero {
    position: fixed;
    top: 112px;
    left: 30px;
    z-index: 5;
    pointer-events: none;
    text-shadow: 0 4px 24px rgba(0, 0, 0, 0.45);
}
.hero-kicker { font-size: 11px; letter-spacing: 3px; color: var(--accent); font-weight: 700; text-transform: uppercase; }
.hero-name { margin-top: 6px; font-size: clamp(38px, 5vw, 72px); font-weight: 800; line-height: 1; letter-spacing: 2px; }
body[data-theme="light"] .hero-name { color: #1f2d3d; text-shadow: 0 4px 20px rgba(255,255,255,0.8); }
.hero-sub { margin-top: 10px; font-size: 13px; color: var(--ink-soft); max-width: 460px; line-height: 1.7; }
.stage-caption {
    position: fixed;
    left: 30px;
    bottom: 54px;
    z-index: 5;
    background: var(--card);
    border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    border-radius: 10px;
    padding: 9px 13px;
    font-size: 12px;
    line-height: 1.7;
    color: var(--ink);
    pointer-events: none;
    backdrop-filter: blur(12px);
}
.stage-hint { position: fixed; left: 30px; bottom: 18px; z-index: 5; font-size: 11px; color: var(--ink-soft); pointer-events: none; }
.fallback {
    position: fixed;
    inset: 0;
    z-index: 30;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--bg);
    color: var(--danger);
    font-size: 15px;
    text-align: center;
}
.hidden { display: none !important; }
.panel {
    position: fixed;
    top: 96px;
    right: 16px;
    bottom: 16px;
    z-index: 10;
    width: 344px;
    padding: 16px;
    overflow-y: auto;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: var(--shadow);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    scrollbar-width: thin;
}
.panel-section { border-bottom: 1px solid var(--line); padding-bottom: 12px; margin-bottom: 12px; }
.panel-section:last-child { border-bottom: none; margin-bottom: 0; }
.panel h2 { margin: 0 0 10px; font-size: 12px; letter-spacing: 1px; color: var(--accent); text-transform: uppercase; }
.button-row { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
button {
    padding: 8px 12px;
    background: var(--tab-active);
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    transition: filter 0.2s, transform 0.2s;
}
button:hover { filter: brightness(1.1); transform: translateY(-1px); }
button.secondary { background: var(--tab-bg); color: var(--ink); border: 1px solid var(--line); }
button.secondary:hover { border-color: var(--accent); }
.control-row { margin-bottom: 10px; }
.control-row label {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    font-size: 11px;
    font-weight: 600;
    color: var(--ink-soft);
    margin-bottom: 4px;
}
.control-row label span { color: var(--accent); font-variant-numeric: tabular-nums; }
input[type=range] { width: 100%; accent-color: var(--accent); }
.switch-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink); margin: 8px 0; }
.switch-row input { accent-color: var(--accent); }
.segment { display: flex; gap: 6px; margin-top: 8px; }
.segment button { flex: 1; padding: 7px 4px; font-size: 11px; background: var(--tab-bg); color: var(--ink); border: 1px solid var(--line); }
.segment button.active { background: var(--tab-active); color: #fff; border-color: transparent; }
.formula {
    background: var(--info);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px;
    font-family: 'Courier New', Consolas, monospace;
    font-size: 12px;
    line-height: 1.8;
    color: var(--ink);
    overflow-x: auto;
}
.formula .line { display: block; white-space: nowrap; }
.numbers { display: grid; grid-template-columns: 1fr; gap: 6px; margin-top: 10px; }
.numbers > div {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    background: var(--info);
    border-left: 3px solid var(--accent);
    border-radius: 6px;
    padding: 7px 9px;
    font-size: 11px;
}
.numbers strong { color: var(--accent); font-variant-numeric: tabular-nums; text-align: right; }
.extra { margin-top: 8px; font-size: 11px; line-height: 1.7; color: var(--ink-soft); }
.note { background: var(--tab-bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px; font-size: 11px; line-height: 1.7; color: var(--ink-soft); }
@media (max-width: 900px) {
    .topbar { right: 16px; flex-direction: column; align-items: flex-start; }
    .tabs { justify-content: flex-start; }
    .hero { top: 150px; left: 18px; }
    .hero-name { font-size: 40px; }
    .stage-caption { left: 18px; bottom: 46px; }
    .stage-hint { left: 18px; bottom: 12px; }
    .panel { top: auto; left: 12px; right: 12px; bottom: 12px; width: auto; max-height: 42vh; }
}
</style>
</head>
<body data-theme="dark">
<div id="stage">
    <div id="fallback" class="fallback hidden"></div>
</div>

<header class="topbar">
    <div class="brand">
        <h1>单摆模型的变形拓展</h1>
        <p>等效摆长 · 等效重力加速度 · 周期公式 · 3D 动态演示</p>
    </div>
    <div class="tabs" id="tabs">
        <button class="tab active" data-model="double">双线摆</button>
        <button class="tab" data-model="fold">折线摆</button>
        <button class="tab" data-model="arc">圆弧摆</button>
        <button class="tab" data-model="incline">斜面摆</button>
        <button class="tab" data-model="cone">圆锥摆</button>
    </div>
    <button id="theme-btn" class="icon-btn">切换浅色</button>
</header>

<div class="hero">
    <div class="hero-kicker">Pendulum Lab / 3D</div>
    <div id="hero-name" class="hero-name">双线摆</div>
    <div id="hero-sub" class="hero-sub">正在载入 3D 场景…</div>
</div>
<div id="stage-caption" class="stage-caption">t = 0.00 s</div>
<div class="stage-hint">拖动旋转视角 · 滚轮缩放 · 顶部切换模型 · 右侧实时调参</div>

<aside class="panel">
    <div class="panel-section">
        <h2>播放控制</h2>
        <div class="button-row">
            <button id="play-btn">暂停</button>
            <button id="reset-btn" class="secondary">重置运动</button>
            <button id="view-btn" class="secondary">重置视角</button>
        </div>
        <div class="control-row">
            <label for="speed">动画速度 <span data-val-for="speed"></span></label>
            <input type="range" id="speed" data-key="speed" data-unit="×" min="0.25" max="2" step="0.05" value="1.1">
        </div>
        <div class="switch-row"><input type="checkbox" id="autorotate-toggle" checked><label for="autorotate-toggle" style="margin:0;">自动旋转视角</label></div>
        <div class="switch-row"><input type="checkbox" id="trail-toggle" checked><label for="trail-toggle" style="margin:0;">显示发光运动轨迹</label></div>
    </div>

    <div class="panel-section">
        <h2>全局参数</h2>
        <div class="control-row">
            <label for="g">重力加速度 g <span data-val-for="g"></span></label>
            <input type="range" id="g" data-key="g" data-unit=" m/s²" min="1" max="20" step="0.1" value="9.8">
        </div>
        <div class="control-row">
            <label for="r">摆球半径 r <span data-val-for="r"></span></label>
            <input type="range" id="r" data-key="r" data-unit=" m" min="0.02" max="0.3" step="0.01" value="0.12">
        </div>
        <div class="control-row">
            <label for="ampDeg">小角振幅 A <span data-val-for="ampDeg"></span></label>
            <input type="range" id="ampDeg" data-key="ampDeg" data-unit="°" min="1" max="18" step="1" value="14">
        </div>
    </div>

    <div class="panel-section">
        <h2>模型参数</h2>

        <div data-models="double" class="model-controls">
            <div class="control-row">
                <label for="l">上线长 l <span data-val-for="l"></span></label>
                <input type="range" id="l" data-key="l" data-unit=" m" min="0.8" max="3" step="0.05" value="2">
            </div>
            <div class="control-row">
                <label for="alphaDeg">上线与水平夹角 α <span data-val-for="alphaDeg"></span></label>
                <input type="range" id="alphaDeg" data-key="alphaDeg" data-unit="°" min="10" max="70" step="1" value="35">
            </div>
            <div class="switch-row">
                <input type="checkbox" id="hang-toggle">
                <label for="hang-toggle" style="margin:0;">在 V 形下交点 C 加挂一段可调下线</label>
            </div>
            <div data-hang class="hidden">
                <div class="control-row">
                    <label for="d">下挂线长 d <span data-val-for="d"></span></label>
                    <input type="range" id="d" data-key="d" data-unit=" m" min="0.2" max="2.5" step="0.05" value="1.2">
                </div>
                <div class="segment">
                    <button data-hang-mode="normal" class="active">像普通双线摆摆</button>
                    <button data-hang-mode="side">侧着摆</button>
                </div>
            </div>
        </div>

        <div data-models="fold" class="model-controls hidden">
            <div class="control-row">
                <label for="l1">长摆线长 l1 <span data-val-for="l1"></span></label>
                <input type="range" id="l1" data-key="l1" data-unit=" m" min="1" max="3" step="0.05" value="2.2">
            </div>
            <div class="control-row">
                <label for="l2">短摆线长 l2 <span data-val-for="l2"></span></label>
                <input type="range" id="l2" data-key="l2" data-unit=" m" min="0.4" max="2" step="0.05" value="1">
            </div>
        </div>

        <div data-models="arc" class="model-controls hidden">
            <div class="control-row">
                <label for="R">圆弧轨道半径 R <span data-val-for="R"></span></label>
                <input type="range" id="R" data-key="R" data-unit=" m" min="1" max="4" step="0.05" value="2.5">
            </div>
        </div>

        <div data-models="incline" class="model-controls hidden">
            <div class="control-row">
                <label for="inclineL">摆线长 l <span data-val-for="inclineL"></span></label>
                <input type="range" id="inclineL" data-key="inclineL" data-unit=" m" min="0.8" max="3" step="0.05" value="2">
            </div>
            <div class="control-row">
                <label for="inclineDeg">斜面倾角 θ <span data-val-for="inclineDeg"></span></label>
                <input type="range" id="inclineDeg" data-key="inclineDeg" data-unit="°" min="5" max="45" step="1" value="25">
            </div>
        </div>

        <div data-models="cone" class="model-controls hidden">
            <div class="control-row">
                <label for="coneL">摆线长 l <span data-val-for="coneL"></span></label>
                <input type="range" id="coneL" data-key="coneL" data-unit=" m" min="0.8" max="3" step="0.05" value="2">
            </div>
            <div class="control-row">
                <label for="coneThetaDeg">半锥角 θ <span data-val-for="coneThetaDeg"></span></label>
                <input type="range" id="coneThetaDeg" data-key="coneThetaDeg" data-unit="°" min="5" max="60" step="1" value="25">
            </div>
        </div>
    </div>

    <div class="panel-section info-card">
        <h2>公式与实时数值</h2>
        <div id="formula" class="formula"></div>
        <div class="numbers">
            <div><span>等效摆长</span><strong id="val-L">—</strong></div>
            <div><span>等效重力加速度</span><strong id="val-geff">—</strong></div>
            <div><span>周期</span><strong id="val-T">—</strong></div>
        </div>
        <div id="val-extra" class="extra"></div>
    </div>

    <div class="panel-section note" id="assumption"></div>
</aside>

<script>
(function () {
'use strict';

/* ===== 1. 常量、主题与状态 ===== */
var CFG = {
    gridY: -2.6,
    lineR: 0.026,
    guideR: 0.014,
    dashR: 0.020,
    tubeR: 0.055,
    labelH: 0.18,

};

var THEMES = {
    dark: {
        fog: 0x070d1c, grid: 0x3d6ea8, gridSub: 0x1c3358, gridOpacity: 0.55,
        line: 0xbcd7ff, bob: 0x66e8ff, bobEmissive: 0x0b4a66, bobEmissiveIntensity: 0.75,
        pivot: 0xff8a80, guide: 0x7fa6d8, dash: 0x5f86b8, track: 0x4b77ad,
        ceiling: 0x7fa6d8, plane: 0x1b3154, cone: 0x66e8ff,
        arrowG: 0xff6b6b, arrowGe: 0x4ade80, arrowT: 0xc084fc,
        edge: 0x7fa6d8, platform: 0x101f3a, ring: 0x4fd8ff, glow: 0x8beeff, bobLight: 0x66e8ff
    },
    light: {
        fog: 0xeaf1f8, grid: 0xaab9c9, gridSub: 0xcbd7e3, gridOpacity: 0.75,
        line: 0x2c3e50, bob: 0x1677c8, bobEmissive: 0x000000, bobEmissiveIntensity: 0,
        pivot: 0xc0392b, guide: 0x7f8c8d, dash: 0x7f8c8d, track: 0x9fb3c8,
        ceiling: 0x7f8c8d, plane: 0xdfe6e9, cone: 0x2980b9,
        arrowG: 0xe74c3c, arrowGe: 0x27ae60, arrowT: 0x8e44ad,
        edge: 0x7f8c8d, platform: 0xf7fafc, ring: 0x3498db, glow: 0x66c7ff, bobLight: 0x8fd0ff
    }
};

var MODELS = {
    double: { name: '双线摆' },
    fold: { name: '折线摆' },
    arc: { name: '圆弧摆' },
    incline: { name: '斜面摆' },
    cone: { name: '圆锥摆' }
};

var state = {
    model: 'double', theme: 'dark',
    playing: true, speed: 1.1, autoRotate: true, showTrail: true,
    t: 0, phase: 0, conePhase: 0,
    g: 9.8, r: 0.12, ampDeg: 14,
    l: 2.0, alphaDeg: 35, d: 1.2,
    l1: 2.2, l2: 1.0, R: 2.5,
    inclineL: 2.0, inclineDeg: 25,
    coneL: 2.0, coneThetaDeg: 25,
    hangOn: false, hangMode: 'normal',
    fold: { phase: 0, side: 0 },
    currentAngle: 0, angleLabel: 'θ'
};

var stage, scene, camera, renderer, controls, grid, groundShadow, platform, ring;
var modelGroup = null, currentUpdate = null, lastFrame = 0, rebuildQueued = false;
var UP;
var MAT = {};
var unitCylinder, unitSphere, unitCone, unitBox, glowTexture;

/* ===== 2. 通用工具 ===== */
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function deg2rad(d) { return d * Math.PI / 180; }
function fmt(v) { return Number(v).toFixed(3); }
function fmt2(v) { return Number(v).toFixed(2); }
function ampRad() { return deg2rad(clamp(state.ampDeg, 1, 20)); }
function theme() { return THEMES[state.theme]; }

function computePeriods() {
    var g = Math.max(0.1, state.g);
    var r = Math.max(0.01, state.r);
    var alpha = deg2rad(clamp(state.alphaDeg, 5, 85));
    var incline = deg2rad(clamp(state.inclineDeg, 5, 60));
    var coneTheta = deg2rad(clamp(state.coneThetaDeg, 5, 70));
    var A = ampRad();
    var l = Math.max(0.3, state.l);
    var d = Math.max(0.1, state.d);
    var l1 = Math.max(0.5, state.l1);
    var l2 = Math.max(0.2, Math.min(state.l2, l1 - 0.2));
    var R = Math.max(r + 0.3, state.R);
    var inclineL = Math.max(0.3, state.inclineL);
    var coneL = Math.max(0.3, state.coneL);
    var h = l * Math.sin(alpha);

    var p = {
        g: g, r: r, alpha: alpha, incline: incline, coneTheta: coneTheta, A: A,
        l: l, d: d, l1: l1, l2: l2, R: R, inclineL: inclineL, coneL: coneL,
        h: h, L: null, L1: null, L2: null, geff: null, T: null
    };

    if (state.model === 'double') {
        if (state.hangOn && state.hangMode === 'side') { p.L = d + r; p.mode = 'side'; }
        else if (state.hangOn) { p.L = h + d + r; p.mode = 'normal'; }
        else { p.L = h + r; p.mode = 'classic'; }
        p.geff = g;
        p.T = 2 * Math.PI * Math.sqrt(p.L / g);
    } else if (state.model === 'fold') {
        p.L1 = l1 + r; p.L2 = l2 + r; p.geff = g;
        p.T = Math.PI * (Math.sqrt(p.L1 / g) + Math.sqrt(p.L2 / g));
        p.halfLong = Math.PI * Math.sqrt(p.L1 / g);
        p.halfShort = Math.PI * Math.sqrt(p.L2 / g);
    } else if (state.model === 'arc') {
        p.L = R - r; p.geff = g; p.T = 2 * Math.PI * Math.sqrt(p.L / g);
    } else if (state.model === 'incline') {
        p.L = inclineL + r; p.geff = g * Math.sin(incline);
        p.T = 2 * Math.PI * Math.sqrt(p.L / p.geff);
    } else if (state.model === 'cone') {
        p.L = coneL + r; p.hCone = p.L * Math.cos(coneTheta);
        p.rCirc = p.L * Math.sin(coneTheta); p.geff = null;

function makeTrail(group, colorHex, count) {
    count = count || 28;
    var dots = [];
    for (var i = 0; i < count; i++) {
        var mat = new THREE.MeshBasicMaterial({
            color: colorHex, transparent: true,
            opacity: 0.55 * (1 - i / count),
            blending: THREE.AdditiveBlending, depthWrite: false

        var m = new THREE.Mesh(unitSphere, mat);
        m.scale.setScalar(0.075 * (1 - i / count * 0.65));
        m.visible = false;
        group.add(m);
        dots.push(m);
    }
    return {
        points: [],
        push: function (pos) {
            this.points.unshift(pos.clone());
            if (this.points.length > count) this.points.pop();
            for (var i = 0; i < dots.length; i++) {
                if (i < this.points.length) {
                    dots[i].visible = true;
                    dots[i].position.copy(this.points[i]);

        reset: function () {
            this.points = [];
            dots.forEach(function (d) { d.visible = false; });
        }
    };
}

function disposeObject(obj) {
    obj.traverse(function (child) {
        if (child.geometry && !child.geometry.userData.shared) child.geometry.dispose();
        var mats = Array.isArray(child.material) ? child.material : [child.material];
        mats.forEach(function (m) { if (m && !m.userData.shared) m.dispose(); });
        if (child.isSprite && child.material && child.material.map) {
            var map = child.material.map;
            if (!(map.userData && map.userData.shared)) map.dispose();
        }
    });
}
function clearGroup(group) {
    for (var i = group.children.length - 1; i >= 0; i--) {
        var child = group.children[i];

    }
}

function addDashedArc(group, center, radius, axis1, axis2, start, end, mat, steps, dashRadius) {

function addSolidArc(group, center, radius, axis1, axis2, start, end, tubeR, mat, closed) {
    var a1 = axis1.clone().normalize(), a2 = axis2.clone().normalize();

}

}
function addDashedLine(group, from, to, mat, dashLen, gapLen) {

function addArrow(group, mat) {

function addInclinePlane(group, O, theta) {
    var e1 = new THREE.Vector3(1, 0, 0);

    var c1 = center.clone().addScaledVector(e1, width / 2).addScaledVector(e2, -length / 2);

function buildDouble() {
    var p = computePeriods(), group = modelGroup;
    var H = 2.2;
    var O = new THREE.Vector3(0, H, 0);
    var a = p.l * Math.cos(p.alpha);
    var A = new THREE.Vector3(-a, H, 0), B = new THREE.Vector3(a, H, 0);
    var down = new THREE.Vector3(0, -1, 0), sideZ = new THREE.Vector3(0, 0, 1), sideX = new THREE.Vector3(1, 0, 0);
    var Aamp = p.A;

    addCeilingBar(group, H, a);
    addPivot(group, A, 'A', new THREE.Vector3(-0.18, 0.18, 0));
    addPivot(group, B, 'B', new THREE.Vector3(0.18, 0.18, 0));
    addPivot(group, O, 'O', new THREE.Vector3(0, 0.22, 0.12));
    addLabel(group, 'α', A.clone().add(new THREE.Vector3(0.24, 0.18, 0)), '#465a75', 0.18);
    addLabel(group, 'α', B.clone().add(new THREE.Vector3(-0.24, 0.18, 0)), '#465a75', 0.18);

    var str1 = addCylinder(group, A, A, CFG.lineR, MAT.line);
    var str2 = addCylinder(group, B, B, CFG.lineR, MAT.line);
    var lowerStr = addCylinder(group, O, O, CFG.lineR, MAT.line);
    var radiusLine = addCylinder(group, O, O, CFG.guideR, MAT.guide);
    var ball = addSphere(group, O, p.r, MAT.bob); ball.castShadow = true;
    var knot = addSphere(group, O, 0.055, MAT.pivot);
    var fx = attachBobFx(group);
    lowerStr.visible = false; knot.visible = false;

    var labelC = null;
    var C0 = O.clone().addScaledVector(down, p.h);

    if (!state.hangOn) {
        addDashedArc(group, O, p.L, down, sideZ, -Aamp, Aamp);
        addStaticRadius(group, O, O.clone().addScaledVector(down, p.L), 'L', MAT.guide);
        addLabel(group, 'h = l·sinα', O.clone().addScaledVector(down, p.h / 2).add(new THREE.Vector3(0, 0, 0.28)), '#465a75', 0.18);
    } else if (state.hangMode === 'side') {
        addDashedArc(group, C0, p.L, down, sideX, -Aamp, Aamp);
        addStaticRadius(group, C0, C0.clone().addScaledVector(down, p.L), 'L = d + r', MAT.guide);
        labelC = addLabel(group, 'C', C0.clone().add(new THREE.Vector3(0, 0.22, 0.12)), '#c0392b', 0.20);
        addLabel(group, '侧摆平面', C0.clone().add(new THREE.Vector3(0, -0.5, 0.35)), '#465a75', 0.18);
    } else {
        addDashedArc(group, O, p.L, down, sideZ, -Aamp, Aamp);
        addStaticRadius(group, O, O.clone().addScaledVector(down, p.L), 'L = h + d + r', MAT.guide);
        labelC = addLabel(group, 'C', C0.clone().add(new THREE.Vector3(0, 0.22, 0.12)), '#c0392b', 0.20);
        addLabel(group, 'h = l·sinα', O.clone().addScaledVector(down, p.h / 2).add(new THREE.Vector3(0, 0, 0.28)), '#465a75', 0.18);
    }

    function update(dt) {
        var omega = Math.sqrt(p.g / p.L);
        state.phase += omega * dt;
        var phi = Aamp * Math.sin(state.phase);
        var axis2 = (!state.hangOn || state.hangMode === 'normal') ? sideZ : sideX;
        var dir = down.clone().multiplyScalar(Math.cos(phi)).addScaledVector(axis2, Math.sin(phi));
        var C, center, surface;

        if (!state.hangOn) {
            C = O.clone().addScaledVector(dir, p.h);
            center = O.clone().addScaledVector(dir, p.L);
            lowerStr.visible = false; knot.visible = false;
        } else if (state.hangMode === 'side') {
            C = C0.clone();
            surface = C.clone().addScaledVector(dir, p.d);
            center = C.clone().addScaledVector(dir, p.L);
            setCylinder(lowerStr, C, surface, CFG.lineR);
            lowerStr.visible = true; setSphere(knot, C, 0.055); knot.visible = true;
        } else {
            C = O.clone().addScaledVector(dir, p.h);
            surface = C.clone().addScaledVector(dir, p.d);
            center = O.clone().addScaledVector(dir, p.L);
            setCylinder(lowerStr, C, surface, CFG.lineR);
            lowerStr.visible = true; setSphere(knot, C, 0.055); knot.visible = true;
        }
        setCylinder(str1, A, C, CFG.lineR);

        setSphere(ball, center, p.r);
        fx.update(center);

    }

}

function buildFold() {
    var p = computePeriods(), group = modelGroup;
    var H = 2.2;
    var A = new THREE.Vector3(0, H, 0);
    var down = new THREE.Vector3(0, -1, 0), sideX = new THREE.Vector3(1, 0, 0);

    addPivot(group, A, 'A', new THREE.Vector3(-0.22, 0.18, 0));
    addPivot(group, P, 'P', new THREE.Vector3(0.22, 0.14, 0));

    addDashedArc(group, P, p.L2, down, sideX, 0, A2, MAT.dash, 32);
    addDashedArc(group, A, p.L1, down, sideX, -A1, 0, MAT.dash, 32);
    addStaticRadius(group, A, eqCenter, 'L1', MAT.guide, new THREE.Vector3(0.35, 0.25, 0.2));
    addStaticRadius(group, P, eqCenter, 'L2', MAT.guide, new THREE.Vector3(-0.35, -0.12, 0.2));

    var upperString = addCylinder(group, A, P, CFG.lineR, MAT.line);
    var mainString = addCylinder(group, A, eqCenter, CFG.lineR, MAT.line);
    var radiusLine = addCylinder(group, A, eqCenter, CFG.guideR, MAT.guide);
    var ball = addSphere(group, eqCenter, p.r, MAT.bob); ball.castShadow = true;
    var fx = attachBobFx(group);

    function update(dt) {
        var side = state.fold.side;

        while (state.fold.phase >= Math.PI) {

        var pivot = side === 0 ? P : A;

        var surface = pivot.clone().addScaledVector(dir, stringLen);

        if (side === 0) {

            setCylinder(mainString, P, surface, CFG.lineR);

}

function buildArc() {

    addSphere(group, M, 0.06, MAT.pivot); addSphere(group, N, 0.06, MAT.pivot);
    addLabel(group, 'M', M.clone().add(new THREE.Vector3(-0.2, 0.16, 0)), '#c0392b', 0.18);
    addLabel(group, 'N', N.clone().add(new THREE.Vector3(0.2, 0.16, 0)), '#c0392b', 0.18);
    addStaticRadius(group, O, trackBottom, 'R', MAT.guide, new THREE.Vector3(0.32, 0, 0.2));
    addStaticRadius(group, O, eqCenter, 'R - r', MAT.guide, new THREE.Vector3(-0.32, 0, 0.2));
    addLabel(group, 'P', eqCenter.clone().add(new THREE.Vector3(0, -0.2, 0.2)), '#465a75', 0.18);

    var radiusLine = addCylinder(group, O, eqCenter, CFG.guideR, MAT.guide);
    var ball = addSphere(group, eqCenter, p.r, MAT.bob); ball.castShadow = true;
    var fx = attachBobFx(group);

    function update(dt) {
        var omega = Math.sqrt(p.g / p.L);
        state.phase += omega * dt;
        var phi = p.A * Math.sin(state.phase);
        var dir = down.clone().multiplyScalar(Math.cos(phi)).addScaledVector(sideX, Math.sin(phi));
        var center = O.clone().addScaledVector(dir, p.L);
        setCylinder(radiusLine, O, center, CFG.guideR);
        setSphere(ball, center, p.r);
        fx.update(center);
        state.currentAngle = phi; state.angleLabel = 'θ';
    }
    update(0); return update;
}

function buildIncline() {
    var p = computePeriods(), group = modelGroup;
    var O = new THREE.Vector3(0, 1.8, 0);
    var downY = new THREE.Vector3(0, -1, 0), hz = new THREE.Vector3(0, 0, 1);
    var basis = addInclinePlane(group, O, p.incline);
    var e1 = basis.e1, e2 = basis.e2;

    addPivot(group, O, 'O', new THREE.Vector3(0, 0.22, 0.12));
    addDashedArc(group, O, 0.75, hz, downY, 0, p.incline, MAT.dash, 24, 0.015);
    var thetaPos = O.clone().addScaledVector(hz, 0.95 * Math.cos(p.incline / 2)).addScaledVector(downY, 0.95 * Math.sin(p.incline / 2));
    addLabel(group, 'θ', thetaPos, '#465a75', 0.20);
    addDashedArc(group, O, p.L, e2, e1, -p.A, p.A, MAT.dash, 48);
    addStaticRadius(group, O, O.clone().addScaledVector(e2, p.L), 'L = l + r', MAT.guide, new THREE.Vector3(0, 0.18, 0.28));

    var string = addCylinder(group, O, O, CFG.lineR, MAT.line);
    var radiusLine = addCylinder(group, O, O.clone().addScaledVector(e2, p.L), CFG.guideR, MAT.guide);
    var ball = addSphere(group, O.clone().addScaledVector(e2, p.L), p.r, MAT.bob); ball.castShadow = true;
    var fx = attachBobFx(group);
    var arrowG = addArrow(group, MAT.arrowG), arrowGe = addArrow(group, MAT.arrowGe);
    var labelG = addLabel(group, 'g', new THREE.Vector3(), '#e74c3c', 0.18);
    var labelGe = addLabel(group, 'g·sinθ', new THREE.Vector3(), '#27ae60', 0.18);

    function update(dt) {
        var omega = Math.sqrt(p.geff / p.L);
        state.phase += omega * dt;
        var phi = p.A * Math.sin(state.phase);
        var dir = e2.clone().multiplyScalar(Math.cos(phi)).addScaledVector(e1, Math.sin(phi));
        var surface = O.clone().addScaledVector(dir, p.inclineL);
        var center = O.clone().addScaledVector(dir, p.L);
        setCylinder(string, O, surface, CFG.lineR);
        setCylinder(radiusLine, O, center, CFG.guideR);
        setSphere(ball, center, p.r);
        fx.update(center);

        var gTip = center.clone().add(new THREE.Vector3(0, -0.9, 0));
        setArrow(arrowG, center, gTip, 0.022, 0.07, 0.18);
        labelG.position.copy(gTip).add(new THREE.Vector3(0.14, 0, 0));
        var geTip = center.clone().addScaledVector(e2, 0.9);
        setArrow(arrowGe, center, geTip, 0.022, 0.07, 0.18);
        labelGe.position.copy(geTip).add(new THREE.Vector3(0.14, 0, 0));

        state.currentAngle = phi; state.angleLabel = 'θ';
    }
    update(0); return update;
}

function buildCone() {
    var p = computePeriods(), group = modelGroup;
    var O = new THREE.Vector3(0, 2.2, 0);
    var down = new THREE.Vector3(0, -1, 0), sideX = new THREE.Vector3(1, 0, 0), sideZ = new THREE.Vector3(0, 0, 1);
    var circleCenter = new THREE.Vector3(0, O.y - p.hCone, 0);
    var eqCenter = circleCenter.clone().add(new THREE.Vector3(p.rCirc, 0, 0));

    addCeilingBar(group, O.y, 0.5);
    addPivot(group, O, 'O', new THREE.Vector3(0, 0.22, 0.12));
    addConeSurface(group, O, p.hCone, p.rCirc);
    addSolidCircle(group, circleCenter, p.rCirc, sideX, sideZ, 0.03, MAT.track);
    addDashedLine(group, O, circleCenter, MAT.dash);
    addLabel(group, 'h', O.clone().add(circleCenter).multiplyScalar(0.5).add(new THREE.Vector3(0.18, 0, 0.12)), '#465a75', 0.20);
    addSphere(group, circleCenter, 0.05, MAT.pivot);
    addLabel(group, 'O′', circleCenter.clone().add(new THREE.Vector3(0, -0.22, 0.12)), '#c0392b', 0.18);
    addDashedArc(group, O, 0.7, down, sideX, 0, p.coneTheta, MAT.dash, 24, 0.015);
    var thetaPos = O.clone().addScaledVector(down, 0.9 * Math.cos(p.coneTheta / 2)).addScaledVector(sideX, 0.9 * Math.sin(p.coneTheta / 2));
    addLabel(group, 'θ', thetaPos.add(new THREE.Vector3(0, 0, 0.12)), '#465a75', 0.20);
    addStaticRadius(group, circleCenter, eqCenter, 'r = L·sinθ', MAT.guide, new THREE.Vector3(0, 0.28, 0.2));

    var string = addCylinder(group, O, eqCenter, CFG.lineR, MAT.line);
    var radiusLine = addCylinder(group, circleCenter, eqCenter, CFG.guideR, MAT.guide);
    var ball = addSphere(group, eqCenter, p.r, MAT.bob); ball.castShadow = true;
    var fx = attachBobFx(group);
    var arrowT = addArrow(group, MAT.arrowT), arrowG = addArrow(group, MAT.arrowG);
    var labelT = addLabel(group, 'T', new THREE.Vector3(), '#8e44ad', 0.18);
    var labelG = addLabel(group, 'mg', new THREE.Vector3(), '#e74c3c', 0.18);

    function update(dt) {
        var omega = Math.sqrt(p.g / p.hCone);
        state.conePhase += omega * dt;
        var phi = state.conePhase;
        var dir = new THREE.Vector3(
            Math.sin(p.coneTheta) * Math.cos(phi),
            -Math.cos(p.coneTheta),
            Math.sin(p.coneTheta) * Math.sin(phi)
        );
        var surface = O.clone().addScaledVector(dir, p.coneL);
        var center = O.clone().addScaledVector(dir, p.L);
        setCylinder(string, O, surface, CFG.lineR);
        setCylinder(radiusLine, circleCenter, center, CFG.guideR);
        setSphere(ball, center, p.r);
        fx.update(center);

        var tTip = center.clone().addScaledVector(dir.clone().negate(), 0.9);
        setArrow(arrowT, center, tTip, 0.022, 0.07, 0.18);
        labelT.position.copy(tTip).add(new THREE.Vector3(0, 0.12, 0));
        var gTip = center.clone().add(new THREE.Vector3(0, -0.9, 0));
        setArrow(arrowG, center, gTip, 0.022, 0.07, 0.18);
        labelG.position.copy(gTip).add(new THREE.Vector3(0.14, 0, 0));

        state.currentAngle = phi; state.angleLabel = 'φ';
    }
    update(0); return update;
}

function destroyModel() {
    if (!modelGroup) return;
    clearGroup(modelGroup);
    scene.remove(modelGroup);
    modelGroup = null; currentUpdate = null;
}
function buildModel() {
    destroyModel();
    modelGroup = new THREE.Group();
    modelGroup.name = 'model-' + state.model;
    modelGroup.scale.setScalar(CFG.modelScale);
    scene.add(modelGroup);
    if (state.model === 'double') currentUpdate = buildDouble();
    else if (state.model === 'fold') currentUpdate = buildFold();
    else if (state.model === 'arc') currentUpdate = buildArc();
    else if (state.model === 'incline') currentUpdate = buildIncline();
    else currentUpdate = buildCone();
    updatePanel();
}

/* ===== 5. 面板与 UI ===== */
function updateControlVisibility() {
    document.querySelectorAll('[data-models]').forEach(function (el) {
        var list = (el.getAttribute('data-models') || '').split(',');
        el.classList.toggle('hidden', list.indexOf(state.model) === -1);
    });
    var showHang = state.model === 'double' && state.hangOn;
    document.querySelectorAll('[data-hang]').forEach(function (el) { el.classList.toggle('hidden', !showHang); });
    document.querySelectorAll('[data-hang-mode]').forEach(function (btn) {
        btn.classList.toggle('active', btn.getAttribute('data-hang-mode') === state.hangMode);
    });
    document.getElementById('hang-toggle').checked = state.hangOn;
    document.getElementById('autorotate-toggle').checked = state.autoRotate;
    document.getElementById('trail-toggle').checked = state.showTrail;
}
function syncSliderDisplays() {
    document.querySelectorAll('input[type=range][data-key]').forEach(function (input) {
        var key = input.getAttribute('data-key');
        if (!(key in state)) return;
        input.value = state[key];
        var span = document.querySelector('[data-val-for="' + key + '"]');
        if (!span) return;
        var v = Number(state[key]), txt;
        if (key === 'g') txt = v.toFixed(1);
        else if (key === 'speed') txt = v.toFixed(2);
        else if (key === 'r' || key === 'l' || key === 'd' || key === 'l1' || key === 'l2' || key === 'R' || key === 'inclineL' || key === 'coneL') txt = v.toFixed(2);
        else if (key === 'ampDeg' || key === 'alphaDeg' || key === 'inclineDeg' || key === 'coneThetaDeg') txt = v.toFixed(0);
        else txt = v.toFixed(2);
        span.textContent = txt + (input.getAttribute('data-unit') || '');
    });
}
function updatePanel() {
    var p = computePeriods();
    var lines = [], extra = '', assumption = '';
    var common = ' 通用假设：小角近似（圆锥摆除外）、无摩擦、轻绳不可伸长、摆球半径 r 计入摆长。';

    if (state.model === 'double') {
        if (!state.hangOn) {
            lines.push('L = l·sinα + r');
            lines.push('g_eff = g');
            lines.push('T = 2π√((l·sinα + r) / g)');
            extra = '当前 α = ' + state.alphaDeg.toFixed(0) + '°，h = l·sinα = ' + fmt(p.h) + ' m，等效摆长 L = ' + fmt(p.L) + ' m。';
            assumption = '双线摆的摆动平面垂直于两上悬点连线；等效悬点为两上悬点中点 O，α 为上线与水平天花板的夹角。' + common;
        } else if (state.hangMode === 'side') {
            lines.push('侧摆：以 V 形下交点 C 为悬点');
            lines.push('L_side = d + r');
            lines.push('g_eff = g');
            lines.push('T_side = 2π√((d + r) / g)');
            extra = '下挂线长 d = ' + fmt2(p.d) + ' m；侧摆方向沿两上悬点连线，V 形上线保持不动。';
            assumption = '加挂下线后仍是单摆。侧摆时等效悬点为 C，等效摆长只含下线与球半径。' + common;
        } else {
            lines.push('普通双线摆：以 O 为等效悬点');
            lines.push('L_normal = l·sinα + d + r');
            lines.push('g_eff = g');
            lines.push('T_normal = 2π√((l·sinα + d + r) / g)');
            extra = 'h = l·sinα = ' + fmt(p.h) + ' m，d = ' + fmt2(p.d) + ' m，总等效摆长 = h + d + r = ' + fmt(p.L) + ' m。';
            assumption = '加挂下线后整体绕两上悬点连线摆动；等效摆长为 O 到球心的距离，等于 h + d + r。' + common;
        }
    } else if (state.model === 'fold') {
        lines.push('L1 = l1 + r，L2 = l2 + r');
        lines.push('g_eff = g');
        lines.push('T = π(√(L1/g) + √(L2/g))');
        lines.push('  = π(√((l1+r)/g) + √((l2+r)/g))');
        extra = '长摆侧半周期 ' + fmt(p.halfLong) + ' s，短摆侧半周期 ' + fmt(p.halfShort) + ' s，合计 ' + fmt(p.T) + ' s。钉子 P 只在短摆侧改变摆长。';
        assumption = '折线摆是组合周期：两侧分别为不同摆长的半个单摆周期；动画在平衡位置保持球心与线速度连续。' + common;
    } else if (state.model === 'arc') {
        lines.push('L = R - r'); lines.push('g_eff = g');
        lines.push('T = 2π√((R - r) / g)');
        extra = '圆弧轨道半径 R = ' + fmt2(p.R) + ' m，球心轨迹半径 R - r = ' + fmt(p.L) + ' m。';
        assumption = '小球在凹形圆弧内侧作小角摆动；等效悬点为圆弧圆心 O，等效摆长为球心到 O 的距离。' + common;
    } else if (state.model === 'incline') {
        lines.push('L = l + r'); lines.push('g_eff = g·sinθ');
        lines.push('T = 2π√((l + r) / (g·sinθ))');
        extra = '斜面倾角 θ = ' + state.inclineDeg.toFixed(0) + '°，g_eff = ' + fmt(p.geff) + ' m/s²。';
        assumption = '摆球在光滑斜面内摆动，回复力由重力沿斜面向下的分量提供。' + common;
    } else if (state.model === 'cone') {
        lines.push('L = l + r，h = L·cosθ');
        lines.push('ω² = g / (L·cosθ) = g / h');
        lines.push('T = 2π√(h / g)');
        extra = '半锥角 θ = ' + state.coneThetaDeg.toFixed(0) + '°，圆周半径 = L·sinθ = ' + fmt(p.rCirc) + ' m，h = ' + fmt(p.hCone) + ' m，ω = ' + fmt(p.omega) + ' rad/s。';
        assumption = '圆锥摆是匀速圆周运动，不是小角简谐振动；张力 T = mg / cosθ，向心力由张力水平分量提供。' + common;
    }

    document.getElementById('formula').innerHTML = lines.map(function (s) { return '<span class="line">' + s + '</span>'; }).join('');
    document.getElementById('val-L').textContent = p.L !== null ? fmt(p.L) + ' m' : 'L1 = ' + fmt(p.L1) + ' m / L2 = ' + fmt(p.L2) + ' m';
    document.getElementById('val-geff').textContent = p.geff !== null ? fmt(p.geff) + ' m/s²' : '—';
    document.getElementById('val-T').textContent = fmt(p.T) + ' s';
    document.getElementById('val-extra').textContent = extra;
    document.getElementById('assumption').textContent = assumption;
    document.getElementById('hero-name').textContent = MODELS[state.model].name;
    document.getElementById('hero-sub').textContent = '周期 T = ' + fmt(p.T) + ' s · ' + (p.geff !== null ? 'g_eff = ' + fmt(p.geff) + ' m/s²' : '匀速圆周运动');
}
function updateCaption() {
    var el = document.getElementById('stage-caption');
    if (!el) return;
    var deg = state.currentAngle * 180 / Math.PI;
    if (state.model === 'cone') deg = ((deg % 360) + 360) % 360;
    el.innerHTML = '<strong>t = ' + state.t.toFixed(2) + ' s</strong> · ' + state.angleLabel + ' = ' + deg.toFixed(1) + '° · 自动旋转 ' + (state.autoRotate ? '开' : '关');
}
function resetMotion() {
    state.t = 0; state.phase = 0; state.conePhase = 0;
    state.fold.phase = 0; state.fold.side = 0;
    state.currentAngle = 0; state.angleLabel = 'θ';
}
function scheduleRebuild() {
    if (rebuildQueued) return;
    rebuildQueued = true;
    requestAnimationFrame(function () { rebuildQueued = false; buildModel(); });
}
function refreshFromUI() { syncSliderDisplays(); updatePanel(); scheduleRebuild(); }
function setModel(key) {
    if (!MODELS[key]) return;
    state.model = key; resetMotion();
    document.querySelectorAll('.tab').forEach(function (btn) { btn.classList.toggle('active', btn.getAttribute('data-model') === key); });
    updateControlVisibility(); syncSliderDisplays(); buildModel();
}
function resetView() {
    camera.position.set(4.8, 3.2, 7.4);
    if (controls && controls.target) controls.target.set(0, 0.55, 0);
    if (controls && controls.update) controls.update();
}
function rebuildGrid(t) {
    if (grid) { scene.remove(grid); grid.geometry.dispose(); grid.material.dispose(); }
    grid = new THREE.GridHelper(24, 48, t.grid, t.gridSub);
    grid.position.y = CFG.gridY + 0.015;
    grid.material.transparent = true;
    grid.material.opacity = t.gridOpacity;
    grid.material.depthWrite = false;
    scene.add(grid);
}
function applyTheme(name) {
    state.theme = name;
    var t = THEMES[name];
    document.body.setAttribute('data-theme', name);
    document.getElementById('theme-btn').textContent = name === 'dark' ? '切换浅色' : '切换深色';
    MAT.line.color.setHex(t.line);
    MAT.bob.color.setHex(t.bob);
    MAT.bob.emissive.setHex(t.bobEmissive);
    MAT.bob.emissiveIntensity = t.bobEmissiveIntensity;
    MAT.pivot.color.setHex(t.pivot);
    MAT.guide.color.setHex(t.guide);
    MAT.dash.color.setHex(t.dash);
    MAT.track.color.setHex(t.track);
    MAT.ceiling.color.setHex(t.ceiling);
    MAT.arrowG.color.setHex(t.arrowG);
    MAT.arrowGe.color.setHex(t.arrowGe);
    MAT.arrowT.color.setHex(t.arrowT);
    MAT.plane.color.setHex(t.plane);
    MAT.coneSurface.color.setHex(t.cone);
    MAT.edge.color.setHex(t.edge);
    MAT.platform.color.setHex(t.platform);
    MAT.ring.color.setHex(t.ring);
    MAT.glow.color.setHex(t.glow);
    if (scene && scene.fog) scene.fog.color.setHex(t.fog);
    rebuildGrid(t);
}
function applyUrlParams() {
    var q;
    try { q = new URLSearchParams(window.location.search); } catch (e) { return; }
    if (!q) return;
    var m = q.get('model');
    if (m && MODELS[m]) state.model = m;
    var th = q.get('theme');
    if (th && THEMES[th]) {
        state.theme = th;
        document.body.setAttribute('data-theme', th);
    }
    if (q.has('hang')) state.hangOn = q.get('hang') === '1';
    var hm = q.get('hangmode');
    if (hm === 'side' || hm === 'normal') state.hangMode = hm;
    document.querySelectorAll('.tab').forEach(function (btn) {
        btn.classList.toggle('active', btn.getAttribute('data-model') === state.model);
    });
}

function bindUI() {
    document.querySelectorAll('.tab').forEach(function (btn) {
        btn.addEventListener('click', function () { setModel(btn.getAttribute('data-model')); });
    });
    document.getElementById('play-btn').addEventListener('click', function () {
        state.playing = !state.playing;
        this.textContent = state.playing ? '暂停' : '播放';
    });
    document.getElementById('reset-btn').addEventListener('click', function () {
        resetMotion(); if (currentUpdate) currentUpdate(0); updateCaption();
    });
    document.getElementById('view-btn').addEventListener('click', resetView);
    document.getElementById('theme-btn').addEventListener('click', function () {
        applyTheme(state.theme === 'dark' ? 'light' : 'dark');
        buildModel();
        updatePanel();
    });
    document.getElementById('autorotate-toggle').addEventListener('change', function () { state.autoRotate = this.checked; });
    document.getElementById('trail-toggle').addEventListener('change', function () { state.showTrail = this.checked; buildModel(); });
    document.querySelectorAll('input[type=range][data-key]').forEach(function (input) {
        input.addEventListener('input', function () {
            state[input.getAttribute('data-key')] = parseFloat(input.value);
            refreshFromUI();
        });
    });
    document.getElementById('hang-toggle').addEventListener('change', function () {
        state.hangOn = this.checked; updateControlVisibility(); refreshFromUI();
    });
    document.querySelectorAll('[data-hang-mode]').forEach(function (btn) {
        btn.addEventListener('click', function () {
            state.hangMode = btn.getAttribute('data-hang-mode');
            updateControlVisibility(); refreshFromUI();
        });
    });
}

/* ===== 6. 初始化与循环 ===== */
function showFallback(msg) {
    var f = document.getElementById('fallback');
    if (f) { f.textContent = msg || '3D 引擎加载失败：请确认 vendor/three.min.js 与 vendor/OrbitControls.js 存在，或当前浏览器支持 WebGL。'; f.classList.remove('hidden'); }
}
function onResize() {
    if (!stage || !renderer || !camera) return;
    var w = stage.clientWidth, h = stage.clientHeight;
    if (w < 2 || h < 2) return;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h, false);
}
function animate(now) {
    var dt = Math.max(0, Math.min((now - lastFrame) / 1000, 0.05));
    lastFrame = now;
    var step = state.playing ? dt * state.speed : 0;
    state.t += step;
    if (currentUpdate) currentUpdate(step);
    updateCaption();
    if (controls) {
        controls.autoRotate = state.autoRotate;
        controls.autoRotateSpeed = 0.9;
        if (controls.update) controls.update();
    }
    renderer.render(scene, camera);
    requestAnimationFrame(animate);
}
function init() {
    stage = document.getElementById('stage');
    if (typeof THREE === 'undefined' || !THREE.WebGLRenderer) {
        showFallback('3D 引擎加载失败：请确认 vendor/three.min.js 与 vendor/OrbitControls.js 存在，或当前浏览器支持 WebGL。');
        return;
    }
    initShared();

    scene = new THREE.Scene();
    scene.background = null;
    scene.fog = new THREE.FogExp2(theme().fog, 0.018);

    camera = new THREE.PerspectiveCamera(42, 1, 0.1, 200);
    camera.position.set(4.8, 3.2, 7.4);
    camera.lookAt(0, 0.55, 0);

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setClearColor(0x000000, 0);
    if (THREE.sRGBEncoding) renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.domElement.style.display = 'block';
    stage.insertBefore(renderer.domElement, stage.firstChild);

    if (THREE.OrbitControls) {
        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.06;
        controls.minDistance = 4.0;
        controls.maxDistance = 20;
        controls.maxPolarAngle = Math.PI * 0.9;
        controls.enablePan = false;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.9;
        controls.target.set(0, 0.55, 0);
        controls.update();
    } else {
        controls = { target: new THREE.Vector3(0, 0.55, 0), update: function () {} };
    }

    scene.add(new THREE.HemisphereLight(0xffffff, 0x20304a, 0.85));
    var key = new THREE.DirectionalLight(0xffffff, 1.0);
    key.position.set(5, 9, 6);
    key.castShadow = true;
    key.shadow.mapSize.set(1024, 1024);
    key.shadow.camera.left = -7; key.shadow.camera.right = 7;
    key.shadow.camera.top = 7; key.shadow.camera.bottom = -7;
    key.shadow.camera.near = 0.5; key.shadow.camera.far = 30;
    var rim = new THREE.DirectionalLight(0x8fb8ff, 0.55);
    rim.position.set(-5, 3, -6);
    scene.add(key, rim);

    groundShadow = new THREE.Mesh(
        new THREE.PlaneGeometry(40, 40),
        new THREE.ShadowMaterial({ opacity: state.theme === 'dark' ? 0.38 : 0.22 })
    );
    groundShadow.rotation.x = -Math.PI / 2;
    groundShadow.position.y = CFG.gridY + 0.02;
    groundShadow.receiveShadow = true;
    scene.add(groundShadow);

    platform = new THREE.Mesh(new THREE.CylinderGeometry(1.7, 1.7, 0.09, 64), MAT.platform);
    platform.position.y = CFG.gridY + 0.045;
    platform.receiveShadow = true;
    scene.add(platform);

    ring = new THREE.Mesh(new THREE.TorusGeometry(1.7, 0.028, 10, 96), MAT.ring);
    ring.rotation.x = -Math.PI / 2;
    ring.position.y = CFG.gridY + 0.10;
    scene.add(ring);

    applyUrlParams();
    bindUI();
    updateControlVisibility();
    syncSliderDisplays();
    applyTheme(state.theme);
    buildModel();
    onResize();

    if (window.ResizeObserver) new ResizeObserver(onResize).observe(stage);
    window.addEventListener('resize', onResize);
    window.addEventListener('pagehide', function () {
        destroyModel();
        if (renderer && renderer.dispose) renderer.dispose();
    });

    lastFrame = performance.now();
    requestAnimationFrame(animate);
}

window.__danbai = {
    state: state, computePeriods: computePeriods,
    buildModel: buildModel, onResize: onResize, setModel: setModel,
    resetMotion: resetMotion, applyTheme: applyTheme, resetView: resetView,
    applyUrlParams: applyUrlParams
};

try { init(); } catch (err) {
    console.error(err);
    showFallback('页面初始化失败：' + (err && err.message ? err.message : err));
}
})();
</script>
</body>
</html>
