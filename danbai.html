<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f6f6f3">
    <meta name="description" content="五种单摆模型的三维交互实验，观察等效摆长、等效重力加速度与周期的关系。">
    <title>单摆模型的变形拓展 · 物理实验室</title>
    <link rel="stylesheet" href="./danbai/style.css?v=3">
    <script defer src="./vendor/three.min.js"></script>
    <script defer src="./vendor/OrbitControls.js"></script>
    <script defer src="./danbai/physics.js?v=4"></script>
    <script defer src="./danbai/scene.js?v=8"></script>
    <script defer src="./danbai/app.js?v=4"></script>
</head>
<body data-theme="light">
<svg class="svg-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
        <symbol id="i-pause" viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></symbol>
        <symbol id="i-play" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7Z"/></symbol>
        <symbol id="i-reset" viewBox="0 0 24 24"><path d="M4 9a8 8 0 1 1 .3 7M4 4v5h5"/></symbol>
        <symbol id="i-view" viewBox="0 0 24 24"><path d="m12 3 9 5v8l-9 5-9-5V8Zm0 0v10m9-5-9 5-9-5m9 5v8"/></symbol>
        <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></symbol>
        <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.5 14A8.5 8.5 0 0 1 10 3.5 8.5 8.5 0 1 0 20.5 14Z"/></symbol>
        <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m8 10 4 4 4-4"/></symbol>
        <symbol id="i-drag" viewBox="0 0 24 24"><path d="M5 9V5h4m6 0h4v4m0 6v4h-4M9 19H5v-4m3-3h8m-4-4v8"/></symbol>
    </defs>
</svg>
<div class="app-shell">
    <header class="app-header">
        <div class="brand">
            <svg class="brand-mark" viewBox="0 0 36 36" aria-hidden="true"><path d="M5 6h26M9 6l16 21"/><circle cx="25" cy="27" r="4"/></svg>
            <div><p class="brand-caption">物理 · 交互实验</p><h1>单摆模型的变形拓展</h1></div>
        </div>
        <div class="header-actions"><span class="header-note">等效摆长与周期关系</span><button type="button" id="theme-btn" class="icon-button" aria-label="切换深色主题" title="切换深色主题"><svg><use href="#i-moon"/></svg></button></div>
    </header>
    <nav id="tabs" class="model-nav" aria-label="选择摆动模型">
        <button type="button" class="model-tab active" data-model="double" aria-pressed="true"><span class="model-index">01</span>双线摆</button>
        <button type="button" class="model-tab" data-model="fold" aria-pressed="false"><span class="model-index">02</span>折线摆</button>
        <button type="button" class="model-tab" data-model="arc" aria-pressed="false"><span class="model-index">03</span>圆弧摆</button>
        <button type="button" class="model-tab" data-model="incline" aria-pressed="false"><span class="model-index">04</span>斜面摆</button>
        <button type="button" class="model-tab" data-model="cone" aria-pressed="false"><span class="model-index">05</span>圆锥摆</button>
    </nav>
    <main class="workspace">
        <section class="experiment" aria-label="三维运动与计算结果">
            <div class="scene-card">
                <div id="stage" class="stage" aria-label="可拖动旋转、滚动缩放的三维摆模型"></div>
                <div id="label-layer" class="label-layer" aria-hidden="true"></div>
                <div class="scene-heading"><p class="scene-eyebrow" id="model-category">等效摆长</p><h2 id="hero-name">双线摆</h2><p id="hero-sub">两个悬点，一条等效转轴。</p></div>
                <div class="scene-status"><span id="status-dot" class="status-dot"></span><span id="play-status">演示中</span></div>
                <div class="scene-legend" id="scene-legend"><span><i class="legend-string"></i>摆线</span><span><i class="legend-guide"></i>辅助线</span><span><i class="legend-trail"></i>球心轨迹</span></div>
                <div class="view-controls" aria-label="视角控制"><button type="button" data-view="front" class="view-button">正视</button><button type="button" data-view="perspective" class="view-button active" aria-pressed="true">立体</button><button type="button" id="view-btn" class="icon-button" aria-label="重置视角" title="重置视角"><svg><use href="#i-view"/></svg></button></div>
            <div id="fallback" class="fallback" role="status" hidden><strong>三维场景暂时无法启动</strong><p id="fallback-message">请使用支持 WebGL 的浏览器。下方仍可调整参数、查看公式与计算结果。</p><button type="button" id="retry-btn" class="text-button">重新加载</button></div>
            </div>
            <div class="transport" aria-label="播放控制">
                <div class="transport-buttons"><button type="button" id="play-btn" class="play-button" aria-label="暂停动画"><svg id="play-icon"><use href="#i-pause"/></svg><span id="play-label">暂停</span></button><button type="button" id="reset-btn" class="icon-button" aria-label="重置运动" title="重置运动"><svg><use href="#i-reset"/></svg></button></div>
                <div class="motion-readout"><span>t <strong id="time-value">0.00</strong><small>s</small></span><span><i id="angle-symbol">θ</i><strong id="angle-value">0.0</strong><small>°</small></span></div>
                <div class="speed-control"><label for="speed">速度</label><input id="speed" type="range" data-key="speed" min="0.25" max="2" step="0.05" value="1.1" aria-label="动画速度"><output for="speed" id="speed-value">1.10×</output></div>
            </div>
            <div class="measurements" aria-label="实时计算结果">
                <div class="measurement"><span class="metric-label" id="length-label">等效摆长 <i>L</i></span><div class="metric-value" id="val-L">1.267<span class="unit">m</span></div></div>
                <div class="measurement"><span class="metric-label">等效重力加速度 <i>g<sub>eff</sub></i></span><div class="metric-value" id="val-geff">9.800<span class="unit">m/s²</span></div></div>
                <div class="measurement period-measurement"><span class="metric-label">周期 <i>T</i></span><div class="metric-value" id="val-T">2.259<span class="unit">s</span></div></div>
            </div>
            <details class="theory" open>
                <summary><span>模型与公式</span><svg><use href="#i-chevron"/></svg></summary>
                <div class="theory-body"><div id="formula" class="formula-block"></div><p id="val-extra" class="formula-detail"></p><p id="assumption" class="explanation"></p><div class="assumptions"><span class="assumption-caption">适用条件</span><p id="assumptions-text">小角近似、光滑无摩擦、轻绳不可伸长；摆球半径 r 计入摆长。</p></div></div>
            </details>
        </section>
        <aside class="inspector" aria-label="实验参数">
            <div class="inspector-header"><h2>实验参数</h2><span>实时生效</span></div>
            <form id="parameter-form" autocomplete="off">
                <section class="parameter-section"><h3>全局设置</h3><div id="global-controls"></div></section>
                <section class="parameter-section"><h3 id="model-parameters-title">模型设置</h3><div id="model-controls"></div><div id="double-options">
                    <label class="switch-row" for="hang-toggle"><span><span class="switch-title">加挂下线</span><small>在 V 形下交点 C 延伸</small></span><span class="switch"><input id="hang-toggle" type="checkbox"><span class="switch-track"></span></span></label>
                    <div id="hang-controls" hidden><div id="lower-string-control"></div><div class="segmented" aria-label="下挂摆动方式"><button type="button" data-hang-mode="normal" class="active" aria-pressed="true">普通摆动</button><button type="button" data-hang-mode="side" aria-pressed="false">侧向摆动</button></div></div>
                </div><p id="constraint-note" class="constraint-note" hidden></p></section>
                <section class="parameter-section display-section"><h3>场景显示</h3>
                    <label class="switch-row" for="autorotate-toggle"><span class="switch-title">自动旋转视角</span><span class="switch"><input id="autorotate-toggle" type="checkbox"><span class="switch-track"></span></span></label>
                    <label class="switch-row" for="trail-toggle"><span class="switch-title">显示运动轨迹</span><span class="switch"><input id="trail-toggle" type="checkbox" checked><span class="switch-track"></span></span></label>
                    <label class="switch-row" for="annotation-toggle"><span class="switch-title">显示教学标注</span><span class="switch"><input id="annotation-toggle" type="checkbox" checked><span class="switch-track"></span></span></label>
                </section>
            </form>
        </aside>
    </main>
</div>
<noscript><p>请启用 JavaScript 以使用三维实验与参数计算。</p></noscript>
</body>
</html>
