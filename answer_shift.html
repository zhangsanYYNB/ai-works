main{max-width:720px;margin:0 auto;padding:12px 14px 120px}

.tagver{position:absolute;top:14px;right:14px;font-size:10.5px;color:#fff;background:var(--blue);padding:3px 9px;border-radius:999px;letter-spacing:2px;opacity:.9}
.part{width:max-content;margin:2px auto 16px;background:var(--teal);color:#fff;font-size:12.5px;letter-spacing:3px;padding:5px 20px;border-radius:999px}
.zu{display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:14px}
.zu .znum{width:27px;height:27px;background:var(--blue);color:#fff;border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
.zu .ztext{font-weight:800;font-size:18px;letter-spacing:4px}
.testname{text-align:center;font-weight:800;font-size:20px;letter-spacing:2px;color:var(--blue);margin-bottom:12px}
.dayline{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:6px;flex-wrap:wrap}

.ty{color:#0b7285;font-weight:700;font-size:15.5px}
.gblock{border-bottom:1px dashed var(--line);padding:9px 6px 7px}
.aline{display:flex;align-items:baseline;gap:16px;padding:3px 0}
.aline .range{flex:0 0 3.4em;color:var(--mut);font-size:13.5px;text-align:right}
.letters{display:flex}
.col{display:inline-block;min-width:1.35em;text-align:center;font-weight:800;font-size:19.5px;color:#1d2f36;border-radius:5px}
.corr .range{color:#c0392b;font-weight:700}
.corr .col{font-size:15px;color:#c0392b;font-weight:700}
.col.d{background:#ffefc2}
.corr .col.d{font-weight:800;text-decoration:underline 2px}
.note{font-size:11.5px;color:#a39c8b;margin-top:10px;text-align:center}
.spacer{flex:1;min-height:18px}
.pagefoot{border-top:1px solid var(--line);margin-top:14px;padding-top:9px;text-align:center}
.pagefoot .pagenum{font-size:16px;letter-spacing:7px;color:#5c564a;font-weight:600}
.pagefoot .cap{font-size:10px;color:#aba48f;margin-top:2px;letter-spacing:1px}

.nav .mid .b{font-size:10.5px;color:var(--mut);margin-top:1px}

    grid[q.gi][q.i]=to;
    shifts.push({gi:q.gi,pos:q.i,from:q.ch,to:to,range:b.g[q.gi][0]});
  });
  return {b:b,disp:grid.map(function(c){return c.join("");}),shifts:shifts};
});
/*ALGO-END*/
(function(){
var card=document.getElementById("card"),prog=document.getElementById("prog"),pbadge=document.getElementById("pbadge"),
    jump=document.getElementById("jump"),prev=document.getElementById("prev"),next=document.getElementById("next");
var cur=parseInt(localStorage.getItem("asfix_idx")||"0",10);
if(!(cur>=0&&cur<RESULT.length))cur=0;
document.getElementById("cntinfo").textContent="共 "+RESULT.length+" 个大题 / "+RESULT.reduce(function(a,r){return a+r.shifts.length;},0)+" 处偏移。";
/* 跳转下拉 */
(function(){
  var groups={};
  RESULT.forEach(function(r,i){(groups[r.b.pt]=groups[r.b.pt]||[]).push(i);});
  Object.keys(groups).forEach(function(pt){
    var og=document.createElement("optgroup");og.label=PARTNAMES[pt];
    groups[pt].forEach(function(i){
      var b=RESULT[i].b,o=document.createElement("option");
      o.value=i;o.textContent="P"+b.pg+" "+(b.zn>0?("题组"+b.zn):b.zu)+(b.day?"·"+b.day.replace(" ",""):"")+" "+b.ty.replace(/ \+ /g,"+");
      og.appendChild(o);
    });
    jump.appendChild(og);
  });
})();
jump.addEventListener("change",function(){cur=+jump.value;render();});
function zuName(b){return b.zn>0?"题组训练"+b.zn:b.zu;}
function mkRow(range,letters,diff,isCorr){
  var line=document.createElement("div");line.className="aline"+(isCorr?" corr":"");
  var rg=document.createElement("span");rg.className="range";rg.textContent=range;line.appendChild(rg);
  var ls=document.createElement("span");ls.className="letters";
  letters.split("").forEach(function(ch,i){
    var sp=document.createElement("span");
    sp.className="col"+(diff[i]?" d":"");
    sp.textContent=ch;ls.appendChild(sp);
  });
  line.appendChild(ls);return line;
}
function render(){
  var r=RESULT[cur],b=r.b;
  card.innerHTML="";
  var tv=document.createElement("div");tv.className="tagver";tv.textContent="偏移版";card.appendChild(tv);
  var pt=document.createElement("div");pt.className="part";pt.textContent=PARTNAMES[b.pt];card.appendChild(pt);
  if(b.zn>0){
    var z=document.createElement("div");z.className="zu";
    z.innerHTML='<span class="znum">'+b.zn+'</span><span class="ztext">题组训练</span>';
    card.appendChild(z);
  }else{
    var tn=document.createElement("div");tn.className="testname";tn.textContent=b.zu;card.appendChild(tn);
  }
  var dl=document.createElement("div");dl.className="dayline";
  if(b.day){var dc=document.createElement("span");dc.className="daychip";dc.textContent=b.day;dl.appendChild(dc);}
  var ty=document.createElement("span");ty.className="ty";ty.textContent="/ "+b.ty+" /";dl.appendChild(ty);
  card.appendChild(dl);
  r.disp.forEach(function(s,gi){
    var diff={};r.shifts.forEach(function(sh){if(sh.gi===gi)diff[sh.pos]=1;});
    var gb=document.createElement("div");gb.className="gblock";
    gb.appendChild(mkRow(b.g[gi][0],s,diff,false));
    gb.appendChild(mkRow("正确",b.g[gi][1],diff,true));
    card.appendChild(gb);
  });
  if(b.n){var n1=document.createElement("div");n1.className="note";n1.textContent="※ 本节还含语法填空(非选择题),未收录";card.appendChild(n1);}
  if(b.note){var n2=document.createElement("div");n2.className="note";n2.textContent="※ "+b.note;card.appendChild(n2);}
  var sp=document.createElement("div");sp.className="spacer";card.appendChild(sp);
  var pf=document.createElement("div");pf.className="pagefoot";
  pf.innerHTML='<div class="pagenum">· '+b.pg+' ·</div><div class="cap">原书第 '+b.pg+' 页</div>';
  card.appendChild(pf);
  prog.textContent="第 "+(cur+1)+" / "+RESULT.length+" 个大题";
  pbadge.textContent="原书 P"+b.pg;
  prev.disabled=(cur===0);next.disabled=(cur===RESULT.length-1);
  jump.value=cur;
  localStorage.setItem("asfix_idx",cur);
}
function go(d){
  var n=cur+d;if(n<0||n>=RESULT.length)return;
  cur=n;render();window.scrollTo({top:0});
}
prev.addEventListener("click",function(){go(-1);});
next.addEventListener("click",function(){go(1);});
document.addEventListener("keydown",function(e){
  if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);
});
render();
})();
</script>
</body>
</html>
