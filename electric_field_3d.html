<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三维电场线仿真 - 多点电荷系统</title>
    <style>
        :root {
            --bg: #070b16;
            --panel: rgba(13, 20, 37, .84);
            --panel-soft: rgba(23, 34, 58, .72);
            --line: rgba(150, 180, 220, .16);
            --text: #edf4ff;
            --muted: #8d9bb5;
            --cyan: #63d9ff;
            --blue: #6387ff;
            --pink: #ff6f91;
            --green: #74e2bd;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; }
        body {
            overflow: hidden;
            color: var(--text);
            font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
            background: var(--bg);
        }
        body::before, body::after {
            content: ""; position: fixed; z-index: -1; border-radius: 50%; filter: blur(2px); pointer-events: none;
        }
        body::before { width: 42vw; height: 42vw; top: -22vw; left: 28vw; background: rgba(41, 92, 180, .25); }
        body::after { width: 34vw; height: 34vw; right: -15vw; bottom: -14vw; background: rgba(111, 42, 154, .2); }

        .container { display: flex; width: 100%; height: 100vh; padding: 18px; gap: 16px; }
        .sidebar {
            width: 342px; flex: 0 0 342px; height: calc(100vh - 36px); overflow-y: auto;
            padding: 24px 18px 20px; border: 1px solid var(--line); border-radius: 24px;
            background: linear-gradient(180deg, rgba(19, 29, 51, .94), rgba(9, 15, 29, .88));
            box-shadow: 0 24px 80px rgba(0,0,0,.32), inset 0 1px 0 rgba(255,255,255,.05);
            scrollbar-width: thin; scrollbar-color: #34466d transparent;
        }
        .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 26px; }
        .brand-mark { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 13px; color: #07111e; font-size: 23px; background: linear-gradient(135deg, var(--cyan), #7894ff); box-shadow: 0 8px 24px rgba(81, 190, 255, .26); }
        .brand h1 { color: var(--text); font-size: 18px; line-height: 1.2; letter-spacing: -.3px; }
        .brand p { margin-top: 4px; color: var(--muted); font-size: 11px; letter-spacing: .08em; }
        h2 { display: flex; align-items: center; gap: 8px; margin: 23px 0 12px; color: #dce9ff; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
        h2::before { content: ""; width: 4px; height: 14px; border-radius: 4px; background: var(--cyan); box-shadow: 0 0 12px var(--cyan); }
        .charge-item { margin-bottom: 12px; padding: 14px; border: 1px solid var(--line); border-radius: 16px; background: rgba(255,255,255,.045); }
        .charge-item:hover { border-color: rgba(99, 217, 255, .35); background: rgba(255,255,255,.065); }
        .charge-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
        .charge-title { display: flex; align-items: center; gap: 8px; color: #e5efff; font-size: 13px; font-weight: 700; }
        .color-indicator { width: 9px; height: 9px; border-radius: 50%; box-shadow: 0 0 10px currentColor; }
        .remove-btn { padding: 4px 8px; border: 1px solid rgba(255,111,145,.25); border-radius: 7px; color: #ff9bb2; background: rgba(255,111,145,.08); font-size: 11px; cursor: pointer; transition: .2s; }
        .remove-btn:hover { color: white; background: rgba(255,111,145,.28); }
        .control-group { margin-bottom: 13px; }
        .control-group:last-child { margin-bottom: 0; }
        .control-group label { display: flex; justify-content: space-between; margin-bottom: 7px; color: var(--muted); font-size: 11px; }
        .value-display { color: var(--cyan); font-variant-numeric: tabular-nums; }
        input[type="range"] { width: 100%; height: 4px; accent-color: var(--cyan); cursor: pointer; }
        input[type="number"] { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; color: var(--text); background: rgba(0,0,0,.2); }
        .btn { width: 100%; min-height: 42px; margin-bottom: 9px; padding: 10px 14px; border: 1px solid transparent; border-radius: 11px; color: var(--text); font-size: 12px; font-weight: 700; cursor: pointer; transition: transform .2s, box-shadow .2s, background .2s; }
        .btn:hover { transform: translateY(-1px); }
        .btn-primary { background: linear-gradient(135deg, #3d8cff, #685eea); box-shadow: 0 8px 20px rgba(67, 113, 255, .2); }
        .btn-primary:hover { box-shadow: 0 10px 25px rgba(67, 113, 255, .38); }
        .btn-secondary { border-color: var(--line); background: rgba(255,255,255,.055); }
        .btn-secondary:hover { border-color: rgba(99,217,255,.4); background: rgba(99,217,255,.1); }
        .button-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .button-row .btn { margin-bottom: 0; }
        .checkbox-group { display: flex; align-items: center; gap: 10px; min-height: 35px; color: #c5d1e6; font-size: 12px; }
        .checkbox-group input { width: 16px; height: 16px; accent-color: var(--cyan); cursor: pointer; }
        .checkbox-group label { cursor: pointer; }
        .range-card { margin-top: 12px; padding: 12px 13px 4px; border: 1px solid var(--line); border-radius: 13px; background: rgba(0,0,0,.14); }
        .preset-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .preset-grid .btn { margin-bottom: 0; min-height: 38px; padding: 8px; font-size: 11px; }
        .preset-grid .btn:last-child { grid-column: 1 / -1; }
        .info-panel { margin-top: 20px; padding: 14px; border: 1px solid rgba(116,226,189,.17); border-radius: 15px; color: var(--muted); background: linear-gradient(135deg, rgba(116,226,189,.08), rgba(99,135,255,.06)); font-size: 11px; line-height: 1.8; }
        .info-panel strong { display: block; margin-bottom: 5px; color: var(--green); font-size: 12px; }

        .main-content { position: relative; flex: 1; min-width: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 24px; background: #080d1b; box-shadow: 0 24px 80px rgba(0,0,0,.28); }
        #canvas-container { width: 100%; height: 100%; }
        .scene-header { position: absolute; z-index: 2; top: 22px; left: 24px; right: 24px; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; }
        .scene-title h2 { margin: 0; color: #f2f7ff; font-size: 20px; letter-spacing: -.03em; text-transform: none; }
        .scene-title h2::before { display: none; }
        .scene-title p { margin-top: 6px; color: var(--muted); font-size: 12px; }
        .scene-badge { padding: 8px 12px; border: 1px solid rgba(116,226,189,.24); border-radius: 20px; color: var(--green); background: rgba(116,226,189,.08); font-size: 11px; }
        .scene-footer { position: absolute; z-index: 2; right: 22px; bottom: 18px; left: 22px; display: flex; justify-content: space-between; align-items: center; pointer-events: none; }
        .legend { display: flex; gap: 14px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: rgba(8,13,27,.72); backdrop-filter: blur(10px); color: var(--muted); font-size: 11px; }
        .legend span { display: flex; align-items: center; gap: 6px; }
        .dot { width: 7px; height: 7px; border-radius: 50%; }
        .dot.pos { background: var(--pink); box-shadow: 0 0 8px var(--pink); }
        .dot.neg { background: #6f8dff; box-shadow: 0 0 8px #6f8dff; }
        .hint { color: rgba(190,205,230,.58); font-size: 11px; }
        @media (max-width: 800px) { body { overflow: auto; } .container { height: auto; min-height: 100vh; flex-direction: column; padding: 10px; } .sidebar { width: 100%; height: auto; max-height: none; flex-basis: auto; } .main-content { height: 68vh; min-height: 480px; } .scene-header { top: 16px; left: 18px; } .hint { display: none; } }
</style>
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-mark">ϟ</div>
                <div>
                    <h1>三维电场实验室</h1>
                    <p>ELECTRIC FIELD LAB · 3D</p>
                </div>
            </div>

            <h2>电荷系统</h2>
            <div id="charges-list"></div>
            <div class="button-row">
                <button class="btn btn-primary" onclick="addCharge()">＋ 添加电荷</button>
                <button class="btn btn-secondary" onclick="resetView()">⌾ 重置视角</button>
            </div>

            <h2>可视化图层</h2>
            <div class="checkbox-group">
                <input type="checkbox" id="show-field-lines" checked onchange="updateDisplay()">
                <label for="show-field-lines">显示电场线</label>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="show-vector-field" onchange="updateDisplay()">
                <label for="show-vector-field">显示向量场</label>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="show-equipotential" onchange="updateDisplay()">
                <label for="show-equipotential">显示等势面切片</label>
            </div>

            <div class="range-card">
                <div class="control-group">
                    <label>电场线数量 <span class="value-display" id="line-count-display">20</span></label>
                    <input type="range" id="line-count" min="5" max="50" value="20" onchange="updateFieldLines()">
                </div>
                <div class="control-group">
                    <label>向量场密度 <span class="value-display" id="vector-density-display">8</span></label>
                    <input type="range" id="vector-density" min="4" max="15" value="8" onchange="updateVectorField()">
                </div>
            </div>

            <h2>快速预设</h2>
            <div class="preset-grid">
                <button class="btn btn-primary" onclick="loadPreset('dipole')">电偶极子</button>
                <button class="btn btn-primary" onclick="loadPreset('quadrupole')">四极子</button>
                <button class="btn btn-primary" onclick="loadPreset('triangle')">三角形排列</button>
            </div>
            <button class="btn btn-secondary" onclick="clearAllCharges()" style="margin-top:9px">⌫ 清除所有电荷</button>

            <div class="info-panel">
                <strong>操作指南</strong>
                拖动电荷球体可改变位置<br>
                左键旋转 · 右键平移 · 滚轮缩放<br>
                正电荷为粉红色，负电荷为蓝色
            </div>
        </aside>

        <main class="main-content">
            <div class="scene-header">
                <div class="scene-title">
                    <h2>场线与势场可视化</h2>
                    <p>观察电荷之间的作用关系与空间分布</p>
                </div>
                <div class="scene-badge">● 实时计算中</div>
            </div>
            <div id="canvas-container"></div>
            <div class="scene-footer">
                <div class="legend">
                    <span><i class="dot pos"></i>正电荷</span>
                    <span><i class="dot neg"></i>负电荷</span>
                </div>
                <div class="hint">拖动球体调整位置</div>
            </div>
        </main>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <script>
        // 全局变量
        let scene, camera, renderer, controls;
        let charges = [];
        let fieldLineMeshes = [];
        let vectorFieldMeshes = [];
        let equipotentialMeshes = [];
        let chargeObjects = [];
        let selectedCharge = null;
        let raycaster, mouse;
        let isDragging = false;
        let dragPlane;

        // 初始化 Three.js 场景
        function init() {
            const container = document.getElementById('canvas-container');
            
            // 创建场景
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a1a);
            
            // 创建相机
            camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(8, 6, 8);
            camera.lookAt(0, 0, 0);
            
            // 创建渲染器
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);
            
            // 添加轨道控制器
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.minDistance = 2;
            controls.maxDistance = 30;
            
            // 添加光源
            const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
            scene.add(ambientLight);
            
            const pointLight = new THREE.PointLight(0xffffff, 1, 100);
            pointLight.position.set(10, 10, 10);
            scene.add(pointLight);
            
            const pointLight2 = new THREE.PointLight(0xffffff, 0.5, 100);
            pointLight2.position.set(-10, -10, -10);
            scene.add(pointLight2);
            
            // 添加坐标轴
            const axesHelper = new THREE.AxesHelper(5);
            scene.add(axesHelper);
            
            // 添加网格
            const gridHelper = new THREE.GridHelper(20, 20, 0x444444, 0x222222);
            scene.add(gridHelper);
            
            // 初始化射线检测
            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();
            
            // 创建拖拽平面
            dragPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
            
            // 事件监听
            window.addEventListener('resize', onWindowResize);
            renderer.domElement.addEventListener('mousedown', onMouseDown);
            renderer.domElement.addEventListener('mousemove', onMouseMove);
            renderer.domElement.addEventListener('mouseup', onMouseUp);
            
            // 添加初始电荷
            loadPreset('dipole');
            
            // 开始动画循环
            animate();
        }

        // 窗口大小调整
        function onWindowResize() {
            const container = document.getElementById('canvas-container');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        // 计算电场
        function calculateElectricField(x, y, z) {
            let Ex = 0, Ey = 0, Ez = 0;
            const k = 8.99e9; // 库仑常数（简化）
            
            for (let charge of charges) {
                const dx = x - charge.x;
                const dy = y - charge.y;
                const dz = z - charge.z;
                const r2 = dx * dx + dy * dy + dz * dz;
                const r = Math.sqrt(r2);
                
                if (r > 0.3) { // 避免除以零
                    const E = k * charge.q / r2;
                    const factor = E / r;
                    Ex += factor * dx;
                    Ey += factor * dy;
                    Ez += factor * dz;
                }
            }
            
            return new THREE.Vector3(Ex, Ey, Ez);
        }

        // 计算电势
        function calculatePotential(x, y, z) {
            let V = 0;
            const k = 8.99e9;
            
            for (let charge of charges) {
                const dx = x - charge.x;
                const dy = y - charge.y;
                const dz = z - charge.z;
                const r = Math.sqrt(dx * dx + dy * dy + dz * dz);
                
                if (r > 0.3) {
                    V += k * charge.q / r;
                }
            }
            
            return V;
        }

// 绘制电场线
        function drawFieldLines() {
            // 清除旧的电场线
            fieldLineMeshes.forEach(mesh => scene.remove(mesh));
            fieldLineMeshes = [];

            const showFieldLines = document.getElementById('show-field-lines').checked;
            if (!showFieldLines) {
                return; // 如果关闭了电场线显示，直接返回
            }

            const lineCount = parseInt(document.getElementById('line-count').value);

            // 分离正负电荷
            const positiveCharges = charges.filter(c => c.q > 0);
            const negativeCharges = charges.filter(c => c.q < 0);

            // 如果只有正电荷或只有负电荷，也需要显示电场线
            if (positiveCharges.length === 0 && negativeCharges.length > 0) {
                // 只有负电荷：电场线从无穷远指向负电荷，我们从边界开始追踪
                for (let charge of negativeCharges) {
                    const linesForThisCharge = Math.max(5, Math.floor(lineCount * Math.abs(charge.q)));
                    generateUniformDirections(linesForThisCharge).forEach(direction => {
                        const points = traceFieldLineToNegative(charge.x, charge.y, charge.z, direction);
                        if (points.length > 1) {
                            createFieldLine(points, false);
                        }
                    });
                }
            } else if (negativeCharges.length === 0 && positiveCharges.length > 0) {
                // 只有正电荷：电场线从正电荷指向无穷远
                for (let charge of positiveCharges) {
                    const linesForThisCharge = Math.max(5, Math.floor(lineCount * charge.q));
                    generateUniformDirections(linesForThisCharge).forEach(direction => {
                        const points = traceFieldLineFromPositive(charge.x, charge.y, charge.z, direction, true);
                        if (points.length > 1) {
                            createFieldLine(points, true);
                        }
                    });
                }
            } else {
                // 既有正电荷也有负电荷
                for (let charge of positiveCharges) {
                    const linesForThisCharge = Math.max(5, Math.floor(lineCount * charge.q));
                    generateUniformDirections(linesForThisCharge).forEach(direction => {
                        const points = traceFieldLineFromPositive(charge.x, charge.y, charge.z, direction, false);
                        if (points.length > 1) {
                            createFieldLine(points, true);
                        }
                    });
                }
            }
        }

        // 生成均匀分布的球面方向（Fibonacci 球面算法）
        function generateUniformDirections(count) {
            const directions = [];
            const goldenRatio = (1 + Math.sqrt(5)) / 2;
            
            for (let i = 0; i < count; i++) {
                const theta = 2 * Math.PI * i / goldenRatio;
                const phi = Math.acos(1 - 2 * (i + 0.5) / count);
                
                directions.push(new THREE.Vector3(
                    Math.sin(phi) * Math.cos(theta),
                    Math.sin(phi) * Math.sin(theta),
                    Math.cos(phi)
                ));
            }
            
            return directions;
        }
        
        // 创建带箭头的电场线
        function createFieldLine(points, fromPositive) {
            if (points.length < 2) return;
            
            // 创建主线条
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const material = new THREE.LineBasicMaterial({ 
                color: fromPositive ? 0xff4444 : 0x4444ff,
                opacity: 0.7,
                transparent: true
            });
            
            const line = new THREE.Line(geometry, material);
            scene.add(line);
            fieldLineMeshes.push(line);
            
            // 在线上添加多个箭头
            const arrowCount = Math.min(3, Math.floor(points.length / 20));
            if (arrowCount > 0) {
                const arrowGeometry = new THREE.ConeGeometry(0.08, 0.3, 8);
                const arrowMaterial = new THREE.MeshBasicMaterial({ 
                    color: fromPositive ? 0xff6666 : 0x6666ff 
                });
                
                for (let i = 1; i <= arrowCount; i++) {
                    const idx = Math.floor((points.length - 1) * i / (arrowCount + 1));
                    if (idx >= 0 && idx < points.length - 1) {
                        const pos = points[idx];
                        const nextPos = points[idx + 1];
                        const dir = new THREE.Vector3().subVectors(nextPos, pos).normalize();
                        
                        const arrow = new THREE.Mesh(arrowGeometry, arrowMaterial);
                        arrow.position.copy(pos);
                        arrow.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
                        scene.add(arrow);
                        fieldLineMeshes.push(arrow);
                    }
                }
            }
        }

        // 追踪电场线（从正电荷出发）
        function traceFieldLineFromPositive(startX, startY, startZ, direction, toInfinity) {
            const points = [];
            let x = startX + direction.x * 0.3;
            let y = startY + direction.y * 0.3;
            let z = startZ + direction.z * 0.3;
            
            // 第一个点要非常接近起始电荷，确保衔接
            points.push(new THREE.Vector3(x, y, z));
            
            const stepSize = 0.15;
            const maxSteps = 400;
            const boundary = 12;
            const minDistToCharge = 0.25;
            
            for (let i = 0; i < maxSteps; i++) {
                const E = calculateElectricField(x, y, z);
                const magnitude = E.length();
                
                if (magnitude < 1e-10) break;
                
                E.normalize();
                
                const dx = E.x * stepSize;
                const dy = E.y * stepSize;
                const dz = E.z * stepSize;
                
                x += dx;
                y += dy;
                z += dz;
                
                // 检查是否超出边界
                if (Math.abs(x) > boundary || Math.abs(y) > boundary || Math.abs(z) > boundary) {
                    break;
                }
                
                // 检查是否接近任何电荷（包括起始电荷）
                let reachedCharge = false;
                for (let charge of charges) {
                    const dist = Math.sqrt(
                        Math.pow(x - charge.x, 2) +
                        Math.pow(y - charge.y, 2) +
                        Math.pow(z - charge.z, 2)
                    );
                    
                    // 如果接近负电荷，说明电场线终止于此
                    if (dist < minDistToCharge && charge.q < 0) {
                        // 将终点精确设置到电荷表面
                        const approachFactor = (minDistToCharge - 0.1) / dist;
                        const finalX = x - (x - charge.x) * (1 - approachFactor * 0.5);
                        const finalY = y - (y - charge.y) * (1 - approachFactor * 0.5);
                        const finalZ = z - (z - charge.z) * (1 - approachFactor * 0.5);
                        points.push(new THREE.Vector3(finalX, finalY, finalZ));
                        reachedCharge = true;
                        break;
                    }
                    
                    // 如果回到正电荷（不应该发生），停止
                    if (dist < minDistToCharge && charge.q > 0) {
                        reachedCharge = true;
                        break;
                    }
                }
                
                if (reachedCharge) break;
                
                points.push(new THREE.Vector3(x, y, z));
            }
            
            return points;
        }
        
        // 追踪电场线（到负电荷）- 用于只有负电荷的情况
        function traceFieldLineToNegative(chargeX, chargeY, chargeZ, outwardDirection) {
            const points = [];
            
            // 从较远处开始，逆着电场方向追踪到负电荷
            const startDistance = 8;
            let x = chargeX + outwardDirection.x * startDistance;
            let y = chargeY + outwardDirection.y * startDistance;
            let z = chargeZ + outwardDirection.z * startDistance;
            
            const stepSize = 0.15;
            const maxSteps = 600;
            const minDistToCharge = 0.25;
            
            for (let i = 0; i < maxSteps; i++) {
                // 记录当前点
                points.push(new THREE.Vector3(x, y, z));
                
                const E = calculateElectricField(x, y, z);
                const magnitude = E.length();
                
                if (magnitude < 1e-10) break;
                
                // 逆着电场方向移动（因为电场线指向负电荷）
                E.normalize();
                
                const dx = -E.x * stepSize;
                const dy = -E.y * stepSize;
                const dz = -E.z * stepSize;
                
                x += dx;
                y += dy;
                z += dz;
                
                // 检查距离电荷的距离
                const dist = Math.sqrt(
                    Math.pow(x - chargeX, 2) +
                    Math.pow(y - chargeY, 2) +
                    Math.pow(z - chargeZ, 2)
                );
                
                // 接近目标负电荷，终止
                if (dist < minDistToCharge) {
                    // 精确衔接到电荷表面
                    const ratio = minDistToCharge / dist;
                    const finalX = chargeX + (x - chargeX) * ratio;
                    const finalY = chargeY + (y - chargeY) * ratio;
                    const finalZ = chargeZ + (z - chargeZ) * ratio;
                    points.push(new THREE.Vector3(finalX, finalY, finalZ));
                    break;
                }
                
                // 检查是否超出边界
                if (Math.abs(x) > 15 || Math.abs(y) > 15 || Math.abs(z) > 15) {
                    break;
                }
            }
            
            // 反转点顺序，使线条从外向内
            points.reverse();
            return points;
        }

        // 旧函数保留兼容性（不再使用）
        function traceFieldLine(startX, startY, startZ, direction, isPositive) {
            return traceFieldLineFromPositive(startX, startY, startZ, direction, false);
        }

        // 绘制向量场
        function drawVectorField() {
            // 清除旧的向量场
            vectorFieldMeshes.forEach(mesh => scene.remove(mesh));
            vectorFieldMeshes = [];

            if (!document.getElementById('show-vector-field').checked) return;

            const density = parseInt(document.getElementById('vector-density').value);
            const range = 5;
            const step = (2 * range) / density;

            for (let x = -range; x <= range; x += step) {
                for (let y = -range; y <= range; y += step) {
                    for (let z = -range; z <= range; z += step) {
                        // 跳过靠近电荷的位置
                        let tooClose = false;
                        for (let charge of charges) {
                            const dist = Math.sqrt(
                                Math.pow(x - charge.x, 2) +
                                Math.pow(y - charge.y, 2) +
                                Math.pow(z - charge.z, 2)
                            );
                            if (dist < 0.5) {
                                tooClose = true;
                                break;
                            }
                        }

                        if (tooClose) continue;

                        const E = calculateElectricField(x, y, z);
                        const magnitude = E.length();

                        if (magnitude < 1e-8) continue;

                        // 归一化并缩放箭头
                        E.normalize();
                        const arrowLength = Math.min(magnitude * 1e-10, 0.5);

                        // 根据电势大小计算颜色（红->黄->蓝）
                        const V = calculatePotential(x, y, z);
                        const normalizedV = Math.tanh(V * 1e-11);
                        let r, g, b;
                        if (normalizedV > 0) {
                            // 正电势：红色到黄色
                            r = 1.0;
                            g = normalizedV;
                            b = 0.0;
                        } else {
                            // 负电势：蓝色到青色
                            r = 0.0;
                            g = -normalizedV * 0.5;
                            b = 1.0;
                        }
                        const color = new THREE.Color(r, g, b);

                        const arrowHelper = new THREE.ArrowHelper(
                            E,
                            new THREE.Vector3(x, y, z),
                            arrowLength,
                            color,
                            0.1,
                            0.05
                        );

                        scene.add(arrowHelper);
                        vectorFieldMeshes.push(arrowHelper);
                    }
                }
            }
        }

        // 绘制等势面切片
        function drawEquipotential() {
            // 清除旧的等势面
            equipotentialMeshes.forEach(mesh => scene.remove(mesh));
            equipotentialMeshes = [];

            if (!document.getElementById('show-equipotential').checked) return;

            const planeY = 0; // XY 平面切片
            const resolution = 60;
            const range = 6;
            const step = (2 * range) / (resolution - 1);

            // 创建等势线（使用 LineSegments）
            const contourLevels = [-5, -3, -1.5, -0.5, 0.5, 1.5, 3, 5]; // 电势等高线级别
            const positions = [];
            const colors = [];

            // 首先计算整个平面的电势
            const potentialMap = [];
            for (let i = 0; i < resolution; i++) {
                potentialMap[i] = [];
                for (let j = 0; j < resolution; j++) {
                    const x = -range + i * step;
                    const z = -range + j * step;
                    const V = calculatePotential(x, planeY, z);
                    potentialMap[i][j] = V * 1e-10; // 缩放电势值
                }
            }

            // 绘制等势线
            for (let level of contourLevels) {
                const levelColor = level > 0 ? 
                    new THREE.Color(1.0, level / 5.0, 0.0) : // 正电势：红到黄
                    new THREE.Color(0.0, -level / 5.0, 1.0);  // 负电势：蓝到青

                // Marching squares 简化版：查找等高线
                for (let i = 0; i < resolution - 1; i++) {
                    for (let j = 0; j < resolution - 1; j++) {
                        const v00 = potentialMap[i][j] - level;
                        const v10 = potentialMap[i + 1][j] - level;
                        const v01 = potentialMap[i][j + 1] - level;
                        const v11 = potentialMap[i + 1][j + 1] - level;

                        // 检查是否有等高线穿过这个单元格
                        const signs = [v00 > 0, v10 > 0, v11 > 0, v01 > 0];
                        const uniqueSigns = new Set(signs).size;

                        if (uniqueSigns > 1) {
                            // 线性插值找到交点
                            const points = [];

                            // 底边
                            if ((v00 > 0) !== (v10 > 0)) {
                                const t = Math.abs(v00) / (Math.abs(v00) + Math.abs(v10));
                                const px = -range + (i + t) * step;
                                const pz = -range + j * step;
                                points.push([px, planeY, pz]);
                            }
                            // 右边
                            if ((v10 > 0) !== (v11 > 0)) {
                                const t = Math.abs(v10) / (Math.abs(v10) + Math.abs(v11));
                                const px = -range + (i + 1) * step;
                                const pz = -range + (j + t) * step;
                                points.push([px, planeY, pz]);
                            }
                            // 顶边
                            if ((v01 > 0) !== (v11 > 0)) {
                                const t = Math.abs(v01) / (Math.abs(v01) + Math.abs(v11));
                                const px = -range + (i + t) * step;
                                const pz = -range + (j + 1) * step;
                                points.push([px, planeY, pz]);
                            }
                            // 左边
                            if ((v00 > 0) !== (v01 > 0)) {
                                const t = Math.abs(v00) / (Math.abs(v00) + Math.abs(v01));
                                const px = -range + i * step;
                                const pz = -range + (j + t) * step;
                                points.push([px, planeY, pz]);
                            }

                            // 连接点成线段
                            if (points.length >= 2) {
                                positions.push(...points[0], ...points[1]);
                                colors.push(levelColor.r, levelColor.g, levelColor.b,
                                          levelColor.r, levelColor.g, levelColor.b);
                                if (points.length >= 4) {
                                    positions.push(...points[2], ...points[3]);
                                    colors.push(levelColor.r, levelColor.g, levelColor.b,
                                              levelColor.r, levelColor.g, levelColor.b);
                                }
                            }
                        }
                    }
                }
            }

            if (positions.length > 0) {
                const geometry = new THREE.BufferGeometry();
                geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
                geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

                const material = new THREE.LineBasicMaterial({
                    vertexColors: true,
                    transparent: true,
                    opacity: 0.8
                });

                const lines = new THREE.LineSegments(geometry, material);
                scene.add(lines);
                equipotentialMeshes.push(lines);
            }
        }

        // 获取最大电荷量
        function getMaxCharge() {
            let maxQ = 0;
            for (let charge of charges) {
                maxQ = Math.max(maxQ, Math.abs(charge.q));
            }
            return maxQ || 1;
        }

        // 更新显示
        function updateDisplay() {
            updateFieldLines();
            updateVectorField();
            drawEquipotential();
        }

        // 更新电场线
        function updateFieldLines() {
            drawFieldLines();
        }

        // 更新向量场
        function updateVectorField() {
            drawVectorField();
        }

        // 添加电荷
        function addCharge() {
            const id = Date.now();
            const charge = {
                id: id,
                x: (Math.random() - 0.5) * 4,
                y: (Math.random() - 0.5) * 4,
                z: (Math.random() - 0.5) * 4,
                q: 1
            };
            charges.push(charge);
            createChargeObject(charge);
            renderChargesList();
            updateDisplay();
        }

        // 创建电荷的 3D 对象
        function createChargeObject(charge) {
            const radius = 0.3 + Math.abs(charge.q) * 0.1;
            const geometry = new THREE.SphereGeometry(radius, 32, 32);
            const material = new THREE.MeshPhongMaterial({
                color: charge.q > 0 ? 0xff4444 : 0x4444ff,
                emissive: charge.q > 0 ? 0x440000 : 0x000044,
                shininess: 100
            });
            
            const sphere = new THREE.Mesh(geometry, material);
            sphere.position.set(charge.x, charge.y, charge.z);
            sphere.userData = { chargeId: charge.id };
            
            scene.add(sphere);
            chargeObjects.push({ mesh: sphere, charge: charge });
        }

        // 更新电荷对象
        function updateChargeObjects() {
            // 清除旧的电荷对象
            chargeObjects.forEach(obj => scene.remove(obj.mesh));
            chargeObjects = [];
            
            for (let charge of charges) {
                createChargeObject(charge);
            }
        }

        // 渲染电荷列表
        function renderChargesList() {
            const container = document.getElementById('charges-list');
            
            if (charges.length === 0) {
                container.innerHTML = '<p style="text-align:center;color:#888;">暂无电荷</p>';
                return;
            }
            
            container.innerHTML = charges.map((charge, index) => `
                <div class="charge-item">
                    <div class="charge-header">
                        <span class="charge-title">
                            <span class="color-indicator" style="background:${charge.q > 0 ? '#ff4444' : '#4444ff'}"></span>
                            电荷 ${index + 1}
                        </span>
                        <button class="remove-btn" onclick="removeCharge(${charge.id})">删除</button>
                    </div>
                    <div class="control-group">
                        <label>电荷量 (q): <span class="value-display">${charge.q.toFixed(2)}</span></label>
                        <input type="range" min="-5" max="5" step="0.1" value="${charge.q}" 
                               onchange="updateCharge(${charge.id}, 'q', this.value)">
                    </div>
                    <div class="control-group">
                        <label>X 坐标: <span class="value-display">${charge.x.toFixed(2)}</span></label>
                        <input type="range" min="-5" max="5" step="0.1" value="${charge.x}" 
                               onchange="updateCharge(${charge.id}, 'x', this.value)">
                    </div>
                    <div class="control-group">
                        <label>Y 坐标: <span class="value-display">${charge.y.toFixed(2)}</span></label>
                        <input type="range" min="-5" max="5" step="0.1" value="${charge.y}" 
                               onchange="updateCharge(${charge.id}, 'y', this.value)">
                    </div>
                    <div class="control-group">
                        <label>Z 坐标: <span class="value-display">${charge.z.toFixed(2)}</span></label>
                        <input type="range" min="-5" max="5" step="0.1" value="${charge.z}" 
                               onchange="updateCharge(${charge.id}, 'z', this.value)">
                    </div>
                </div>
            `).join('');
        }

        // 更新电荷
        function updateCharge(id, property, value) {
            const charge = charges.find(c => c.id === id);
            if (charge) {
                charge[property] = parseFloat(value);
                
                // 如果是电荷量变化，需要更新球体大小和颜色
                if (property === 'q') {
                    updateChargeObjects();
                } else {
                    // 如果是位置变化，更新对应的 3D 对象
                    const obj = chargeObjects.find(o => o.charge.id === id);
                    if (obj) {
                        obj.mesh.position[property] = charge[property];
                    }
                }
                
                renderChargesList();
                updateDisplay();
            }
        }

        // 删除电荷
        function removeCharge(id) {
            charges = charges.filter(c => c.id !== id);
            updateChargeObjects();
            renderChargesList();
            updateDisplay();
        }

        // 清除所有电荷
        function clearAllCharges() {
            charges = [];
            updateChargeObjects();
            renderChargesList();
            updateDisplay();
        }

        // 加载预设
        function loadPreset(type) {
            clearAllCharges();
            
            switch(type) {
                case 'dipole':
                    charges.push({ id: Date.now(), x: -1.5, y: 0, z: 0, q: 2 });
                    charges.push({ id: Date.now() + 1, x: 1.5, y: 0, z: 0, q: -2 });
                    break;
                case 'quadrupole':
                    charges.push({ id: Date.now(), x: -1, y: 0, z: 0, q: 1 });
                    charges.push({ id: Date.now() + 1, x: 1, y: 0, z: 0, q: -1 });
                    charges.push({ id: Date.now() + 2, x: 0, y: 0, z: -1, q: 1 });
                    charges.push({ id: Date.now() + 3, x: 0, y: 0, z: 1, q: -1 });
                    break;
                case 'triangle':
                    charges.push({ id: Date.now(), x: 1.5, y: 0, z: 0, q: 1.5 });
                    charges.push({ id: Date.now() + 1, x: -1.5, y: 0, z: 0, q: -1 });
                    charges.push({ id: Date.now() + 2, x: 0, y: 0, z: 1.5, q: -1 });
                    break;
            }
            
            updateChargeObjects();
            renderChargesList();
            updateDisplay();
        }

        // 重置视角
        function resetView() {
            camera.position.set(8, 6, 8);
            camera.lookAt(0, 0, 0);
            controls.reset();
        }

        // 鼠标事件处理
        function onMouseDown(event) {
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            
            const intersects = raycaster.intersectObjects(
                chargeObjects.map(obj => obj.mesh)
            );
            
            if (intersects.length > 0) {
                isDragging = true;
                selectedCharge = chargeObjects.find(
                    obj => obj.mesh === intersects[0].object
                ).charge;
                controls.enabled = false;
                
                // 设置拖拽平面朝向相机
                const normal = new THREE.Vector3();
                camera.position.clone().normalize().negate();
                dragPlane.setFromNormalAndCoplanarPoint(
                    normal,
                    intersects[0].point
                );
            }
        }

        function onMouseMove(event) {
            if (!isDragging || !selectedCharge) return;
            
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            
            const intersectionPoint = new THREE.Vector3();
            raycaster.ray.intersectPlane(dragPlane, intersectionPoint);
            
            // 限制在合理范围内
            const boundary = 5;
            selectedCharge.x = Math.max(-boundary, Math.min(boundary, intersectionPoint.x));
            selectedCharge.y = Math.max(-boundary, Math.min(boundary, intersectionPoint.y));
            selectedCharge.z = Math.max(-boundary, Math.min(boundary, intersectionPoint.z));
            
            // 更新 3D 对象位置
            const obj = chargeObjects.find(o => o.charge.id === selectedCharge.id);
            if (obj) {
                obj.mesh.position.copy(selectedCharge);
            }
            
            renderChargesList();
            updateDisplay();
        }

        function onMouseUp() {
            isDragging = false;
            selectedCharge = null;
            controls.enabled = true;
        }

        // 动画循环
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        // 页面加载完成后初始化
        window.onload = init;
    </script>
</body>
</html>
