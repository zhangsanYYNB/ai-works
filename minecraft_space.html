<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,max-scale=1">
<title>星际方块 · 我的世界 × 无人深空</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Segoe UI','Microsoft YaHei',sans-serif;color:#fff;touch-action:none}
#gameCanvas{display:block;width:100vw;height:100vh}
/* ===== HUD ===== */
.hud{position:absolute;top:0;left:0;right:0;padding:8px 12px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:10;text-shadow:0 2px 4px rgba(0,0,0,0.9)}
.hud-left,.hud-right{display:flex;flex-direction:column;gap:4px}
.stat-bar{display:flex;align-items:center;gap:5px;background:rgba(0,0,0,0.45);padding:3px 8px;border-radius:14px;backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,0.1);font-size:12px;font-weight:600}
.stat-bar .icon{font-size:12px}
.stat-bar .bar{width:56px;height:5px;background:rgba(255,255,255,0.15);border-radius:3px;overflow:hidden}
.stat-bar .fill{height:100%;transition:width .15s;border-radius:3px}
.health .fill{background:linear-gradient(90deg,#ff3b30,#ff6b6b)}
.hunger .fill{background:linear-gradient(90deg,#ff9500,#ffcc00)}
.oxygen .fill{background:linear-gradient(90deg,#00d4ff,#5ac8fa)}
.crosshair{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:5}
.crosshair::before,.crosshair::after{content:'';position:absolute;background:rgba(255,255,255,0.7);box-shadow:0 0 4px rgba(0,0,0,0.8)}
.crosshair::before{width:12px;height:2px;top:50%;left:50%;transform:translate(-50%,-50%)}
.crosshair::after{width:2px;height:12px;top:50%;left:50%;transform:translate(-50%,-50%)}
/* 挖掘进度条 */
.mine-progress{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:40px;height:4px;background:rgba(0,0,0,0.5);border-radius:2px;pointer-events:none;z-index:6;display:none;border:1px solid rgba(255,255,255,0.2)}
.mine-progress .fill{height:100%;background:linear-gradient(90deg,#ff3b30,#ffcc00);border-radius:2px;transition:width .05s}
/* ===== 快捷栏 ===== */
.hotbar{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:3px;background:rgba(0,0,0,0.5);padding:4px;border-radius:6px;backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.12);z-index:10;transition:bottom .2s}
.hotbar.raised{bottom:180px;transform:translateX(-50%) scale(.82)}
.hotbar-slot{width:48px;height:48px;background:rgba(255,255,255,0.04);border:2px solid rgba(255,255,255,0.15);border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:22px;position:relative;transition:all .12s}
@media(max-width:600px){.hotbar-slot{width:38px;height:38px;font-size:18px}}
.hotbar-slot.active{border-color:#fff;background:rgba(255,255,255,0.18);transform:scale(1.06);box-shadow:0 0 10px rgba(255,255,255,0.35)}
.hotbar-slot .block-icon{width:22px;height:22px;border-radius:3px;border:1px solid rgba(255,255,255,.35);box-shadow:inset 1.5px 1.5px 0 rgba(255,255,255,.3),inset -1.5px -1.5px 0 rgba(0,0,0,.35);display:inline-block}
.hotbar-slot .count{position:absolute;bottom:1px;right:3px;font-size:10px;font-weight:bold;text-shadow:1px 1px 0 #000}
/* ===== 触摸控制 ===== */
.touch-controls{display:none;position:absolute;inset:0;pointer-events:none;z-index:8}
.touch-controls.on{display:block}
.joystick{position:absolute;bottom:80px;left:20px;width:110px;height:110px;background:rgba(255,255,255,0.06);border:2px solid rgba(255,255,255,0.18);border-radius:50%;pointer-events:auto;touch-action:none}
.joystick-stick{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:42px;height:42px;background:rgba(255,255,255,0.25);border:2px solid rgba(255,255,255,0.4);border-radius:50%;transition:none}
.look-area{position:absolute;top:0;right:0;width:55%;height:72%;pointer-events:auto;touch-action:none}
.action-buttons{position:absolute;bottom:90px;right:20px;display:flex;flex-direction:column;gap:10px;pointer-events:auto}
.action-btn{width:54px;height:54px;border-radius:50%;border:2px solid rgba(255,255,255,0.35);background:rgba(255,255,255,0.08);color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);touch-action:none}
.action-btn:active{background:rgba(255,255,255,0.25);transform:scale(0.93)}
.action-btn.jump{background:rgba(76,175,80,0.2);border-color:rgba(76,175,80,0.5)}
.action-btn.break{background:rgba(244,67,54,0.2);border-color:rgba(244,67,54,0.5)}
.action-btn.place{background:rgba(33,150,243,0.2);border-color:rgba(33,150,243,0.5)}
.action-btn.inv{background:rgba(255,152,0,0.2);border-color:rgba(255,152,0,0.5);font-size:16px}
.planet-btn{position:absolute;top:70px;right:70px;width:44px;height:44px;border-radius:50%;border:2px solid rgba(170,0,255,0.5);background:rgba(170,0,255,0.15);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);pointer-events:auto;touch-action:none}
.planet-btn:active{background:rgba(170,0,255,0.35);transform:scale(0.93)}
/* ===== 菜单/覆盖层 ===== */
.overlay{position:absolute;inset:0;background:rgba(0,0,0,0.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;backdrop-filter:blur(8px)}
.overlay.hidden{display:none}
.title{font-size:clamp(24px,5vw,48px);font-weight:900;background:linear-gradient(135deg,#00d4ff,#5856d6,#af52de);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px;text-align:center;letter-spacing:2px}
.subtitle{color:#aaa;font-size:clamp(12px,2vw,16px);margin-bottom:24px;text-align:center}
.btn-primary{padding:10px 30px;font-size:16px;font-weight:bold;background:linear-gradient(135deg,#00d4ff,#5856d6);color:#fff;border:none;border-radius:24px;cursor:pointer;box-shadow:0 6px 16px rgba(88,86,214,0.4);transition:transform .2s}
.btn-primary:active{transform:scale(0.96)}
.btn-danger{padding:10px 30px;font-size:16px;font-weight:bold;background:linear-gradient(135deg,#ff6b6b,#ff3b30);color:#fff;border:none;border-radius:24px;cursor:pointer;box-shadow:0 6px 16px rgba(255,59,48,0.4);transition:transform .2s}
.instructions{margin-top:20px;color:#888;font-size:12px;text-align:center;line-height:1.8;max-width:440px;padding:0 14px}
.instructions kbd{display:inline-block;padding:2px 6px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:3px;font-family:monospace;font-size:11px}
.pause-btn{position:absolute;top:8px;right:12px;width:34px;height:34px;border-radius:6px;background:rgba(0,0,0,0.35);border:1px solid rgba(255,255,255,0.15);color:#fff;font-size:15px;cursor:pointer;z-index:11;backdrop-filter:blur(6px)}
.planet-info{position:absolute;top:72px;left:12px;background:rgba(0,0,0,0.5);padding:5px 10px;border-radius:6px;border:1px solid rgba(0,212,255,0.25);font-size:11px;z-index:10;backdrop-filter:blur(6px);pointer-events:auto;cursor:pointer}
.planet-info .pn{color:#00d4ff;font-weight:bold}
/* ===== 背包/合成界面 ===== */
.inv-screen{position:absolute;inset:0;background:rgba(0,0,0,0.85);z-index:15;display:none;flex-direction:column;padding:16px;backdrop-filter:blur(10px)}
.inv-screen.open{display:flex}
.inv-title{font-size:18px;font-weight:bold;color:#00d4ff;margin-bottom:12px;text-align:center}
.inv-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;max-width:500px;margin:0 auto;width:100%;overflow-y:auto;flex:1}
.inv-item{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:6px;padding:8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;min-height:60px;justify-content:center}
.inv-item .bi{width:28px;height:28px;border-radius:4px;border:1px solid rgba(255,255,255,.25);box-shadow:inset 1.5px 1.5px 0 rgba(255,255,255,.25),inset -1.5px -1.5px 0 rgba(0,0,0,.3)}
.inv-item .iname{color:#ccc;font-size:10px;word-break:keep-all}
.inv-item .icount{color:#ffcc00;font-size:11px;font-weight:bold}
.craft-section{max-width:500px;margin:10px auto 0;width:100%;border-top:1px solid rgba(255,255,255,0.1);padding-top:10px;max-height:160px;overflow-y:auto}
.craft-title{font-size:14px;font-weight:bold;color:#af52de;margin-bottom:6px}
.craft-row{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;background:rgba(255,255,255,0.04);border-radius:6px;margin-bottom:4px;font-size:12px;flex-wrap:wrap;gap:4px}
.craft-row .cname{color:#fff;font-weight:bold}
.craft-row .cmat{color:#aaa;font-size:11px}
.craft-row .cbtn{padding:4px 14px;border-radius:14px;border:none;font-size:11px;font-weight:bold;cursor:pointer;background:#5856d6;color:#fff}
.craft-row .cbtn:disabled{background:#333;color:#666;cursor:not-allowed}
.craft-row .cbtn.craftable{background:#00d4ff;color:#000}
.close-inv{position:absolute;top:12px;right:16px;width:32px;height:32px;border-radius:6px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:#fff;font-size:16px;cursor:pointer;z-index:16;display:flex;align-items:center;justify-content:center}
/* 飞船发射动画 */
.launch-overlay{position:absolute;inset:0;z-index:25;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,0.9);flex-direction:column}
.launch-overlay.show{display:flex}
.launch-count{font-size:80px;font-weight:900;color:#00d4ff;text-shadow:0 0 40px rgba(0,212,255,0.5)}
.launch-text{color:#aaa;font-size:16px;margin-top:16px;letter-spacing:3px}
/* 加载 */
.loading{position:absolute;inset:0;background:radial-gradient(circle at center,#1a1a3e 0%,#000 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100}
.loading.hidden{display:none}
.loader{width:44px;height:44px;border:4px solid rgba(0,212,255,0.2);border-top-color:#00d4ff;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{margin-top:14px;color:#00d4ff;letter-spacing:3px;font-size:12px}
.event-toast{position:absolute;top:26%;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.7);padding:8px 18px;border-radius:6px;border:1px solid rgba(0,212,255,0.35);color:#fff;font-size:13px;z-index:12;pointer-events:none;opacity:0;transition:opacity .3s}
.event-toast.show{opacity:1}
</style>
</head>

/* 挖掘硬度（秒） */
const HARDNESS={[BLOCK.GRASS]:.4,[BLOCK.DIRT]:.4,[BLOCK.SAND]:.4,[BLOCK.SNOW]:.35,[BLOCK.ICE]:.7,[BLOCK.WOOD]:.8,[BLOCK.LEAVES]:.2,[BLOCK.SANDSTONE]:.8,[BLOCK.STONE]:1.4,[BLOCK.IRON]:2.2,[BLOCK.GOLD]:2.0,[BLOCK.DIAMOND]:3.0,[BLOCK.CRYSTAL]:1.8,[BLOCK.OBSIDIAN]:4.0,[BLOCK.MARS_ROCK]:1.2,[BLOCK.BEDROCK]:999,[BLOCK.LAVA]:.1,[BLOCK.ALIEN_GRASS]:.4,[BLOCK.SPACE_DUST]:.5,[BLOCK.GLOW_MOSS]:.4};

/* ========== 噪声 ========== */
const _fade=t=>t*t*t*(t*(t*6-15)+10);

/* ========== 世界生成 ========== */
const CHUNK_SIZE=16;
function wk(x,y,z){return x+','+y+','+z}
function setBlock(x,y,z,id,md=true){
const k=wk(x,y,z);
const old=Game.world.get(k);
if(old&&old!==id)Game.dirtyTypes.add(old);
if(id===BLOCK.AIR)Game.world.delete(k);else Game.world.set(k,id);
Game.dirtyTypes.add(id);
// 同步到分块数据
const cx=Math.floor(x/16),cz=Math.floor(z/16),ck=cx+','+cz;
let cd=Game.chunkData.get(ck);
if(id===BLOCK.AIR){
if(cd){cd.delete(k);if(cd.size===0)Game.chunkData.delete(ck);}
}else{
if(!cd){cd=new Map();Game.chunkData.set(ck,cd);}
cd.set(k,id);
}
if(md)Game.meshDirty=Game.meshDirty||false; // 细粒度重建由 dirtyTypes 驱动
}
function getBlock(x,y,z){return Game.world.get(wk(x,y,z))||BLOCK.AIR}
function chunkCoord(v){return Math.floor(v/CHUNK_SIZE)}
function getHeight(x,z,planet){return planet.heightGen(x,z)}

function addTree(x,y,z){
const h=y;
for(let yt=h+1;yt<=h+4;yt++)setBlock(x,yt,z,BLOCK.WOOD,false);
for(let dx=-2;dx<=2;dx++)for(let dz=-2;dz<=2;dz++){if(Math.abs(dx)===2&&Math.abs(dz)===2)continue;setBlock(x+dx,h+3,z+dz,BLOCK.LEAVES,false);}
for(let dx=-1;dx<=1;dx++)for(let dz=-1;dz<=1;dz++)setBlock(x+dx,h+4,z+dz,BLOCK.LEAVES,false);
setBlock(x,h+5,z,BLOCK.LEAVES,false);
}
function addPillar(x,y,z,block,minH=2,maxH=5){
const h2=y+randi(minH,maxH);
for(let yt=y+1;yt<=h2;yt++)setBlock(x,yt,z,block,false);
}
function addCluster(x,y,z,block,radius=1){
for(let dx=-radius;dx<=radius;dx++)for(let dy=-radius;dy<=radius;dy++)for(let dz=-radius;dz<=radius;dz++){
if(Math.abs(dx)+Math.abs(dy)+Math.abs(dz)>radius*2)continue;
const nx=x+dx,ny=y+dy,nz=z+dz;
if(getBlock(nx,ny,nz)===BLOCK.AIR)setBlock(nx,ny,nz,block,false);
}
}

function generateChunk(cx,cz){
const planet=Game.planets[Game.planetId];
const x0=cx*CHUNK_SIZE,z0=cz*CHUNK_SIZE;
for(let dx=0;dx<CHUNK_SIZE;dx++)for(let dz=0;dz<CHUNK_SIZE;dz++){
const x=x0+dx,z=z0+dz;
const h=getHeight(x,z,planet);
for(let y=0;y<=h+2;y++){
let b=planet.surfaceGen(x,y,z,h);
if(b===BLOCK.STONE)b=planet.oreGen(x,y,z,h);
if(b!==BLOCK.AIR)setBlock(x,y,z,b,false);
}
const g=hash(x,0,z);
if(planet.id==='earth'&&x%9===0&&z%9===0&&g<.4&&h>12)addTree(x,h,z);
if(planet.id==='mars'&&x%8===0&&z%8===0&&g<.5&&h>12)addPillar(x,h,z,BLOCK.MARS_ROCK,2,5);
if(planet.id==='ice'&&x%8===0&&z%8===0&&g<.5&&h>12)addPillar(x,h,z,BLOCK.ICE,2,5);
if(planet.id==='alien'&&x%6===0&&z%6===0&&g<.4&&h>12)addPillar(x,h,z,BLOCK.OBSIDIAN,2,4);
if(planet.id==='crystal'&&x%5===0&&z%5===0&&g<.6&&h>10)addPillar(x,h,z,BLOCK.CRYSTAL,2,6);
}
Game.chunks.set(cx+','+cz,true);
Game.meshDirty=true;
}

function requestChunks(){
const pcx=chunkCoord(Game.player.x),pcz=chunkCoord(Game.player.z);
const want=[];
for(let dx=-RENDER_DIST;dx<=RENDER_DIST;dx++)for(let dz=-RENDER_DIST;dz<=RENDER_DIST;dz++){
const cx=pcx+dx,cz=pcz+dz,k=cx+','+cz;
if(Game.chunks.get(k)===undefined)want.push([cx,cz,Math.max(Math.abs(dx),Math.abs(dz))]);
}
want.sort((a,b)=>a[2]-b[2]);
Game.pendingChunks=want;
}
function streamChunks(budget=4){
let n=0;
while(Game.pendingChunks.length&&n<budget){const c=Game.pendingChunks.shift();generateChunk(c[0],c[1]);n++;}
return n;
}
function cleanupWorld(){
const pcx=chunkCoord(Game.player.x),pcz=chunkCoord(Game.player.z);
for(const k of Game.chunks.keys()){
const[kx,kz]=k.split(',').map(Number);
if(Math.abs(kx-pcx)>RENDER_DIST+2||Math.abs(kz-pcz)>RENDER_DIST+2){
const x0=kx*16,z0=kz*16;
for(let xx=x0;xx<x0+16;xx++)for(let zz=z0;zz<z0+16;zz++)for(let y=0;y<60;y++)Game.world.delete(wk(xx,y,zz));
Game.chunks.delete(k);
}
}
}

const _dummy=new THREE.Object3D();
function scanTypes(types,px,pz,R){
const listMap={};types.forEach(id=>listMap[id]=[]);
const expCache={};
function isExposed(x,y,z){
const k=x+','+y+','+z;
if(expCache[k]!==undefined)return expCache[k];
let e=false;
if(getBlock(x+1,y,z)===BLOCK.AIR||getBlock(x-1,y,z)===BLOCK.AIR||getBlock(x,y+1,z)===BLOCK.AIR||getBlock(x,y-1,z)===BLOCK.AIR||getBlock(x,y,z+1)===BLOCK.AIR||getBlock(x,y,z-1)===BLOCK.AIR)e=true;
if(!e&&(TRANSPARENT.has(getBlock(x+1,y,z))||TRANSPARENT.has(getBlock(x-1,y,z))||TRANSPARENT.has(getBlock(x,y+1,z))||TRANSPARENT.has(getBlock(x,y-1,z))||TRANSPARENT.has(getBlock(x,y,z+1))||TRANSPARENT.has(getBlock(x,y,z-1))))e=true;
expCache[k]=e;return e;
}
const c0=chunkCoord(px-R),c1=chunkCoord(px+R),d0=chunkCoord(pz-R),d1=chunkCoord(pz+R);
for(let cx=c0;cx<=c1;cx++)for(let cz=d0;cz<=d1;cz++){
const cd=Game.chunkData.get(cx+','+cz);
if(!cd)continue;
for(const[key,id]of cd){
if(!listMap[id])continue;
const c1a=key.indexOf(','),c2a=key.indexOf(',',c1a+1);
const x=+key.slice(0,c1a),y=+key.slice(c1a+1,c2a),z=+key.slice(c2a+1);
if(Math.abs(x-px)>R||Math.abs(z-pz)>R)continue;
if(isExposed(x,y,z))listMap[id].push(x+.5,y+.5,z+.5);
}
}
return listMap;
}
function applyToMesh(mesh,arr){
const n=Math.min(arr.length/3,mesh===Game.crystalMesh?3000:Game.leafMesh&&mesh===Game.leafMesh?MAX_SPEC:mesh===Game.waterMesh?MAX_SPEC:MAX_INST);
mesh.count=n;
for(let i=0;i<n;i++){_dummy.position.set(arr[i*3],arr[i*3+1],arr[i*3+2]);_dummy.updateMatrix();mesh.setMatrixAt(i,_dummy.matrix);}
mesh.instanceMatrix.needsUpdate=true;
}
function rebuildType(id){
const px=Math.floor(Game.player.x),pz=Math.floor(Game.player.z);
const R=RENDER_DIST*CHUNK_SIZE+6,area=(R*2)*(R*2);
if(id===BLOCK.LEAVES){applyToMesh(Game.leafMesh,scanTypes([id],px,pz,R)[id]);return;}
if(id===BLOCK.WATER){applyToMesh(Game.waterMesh,scanTypes([id],px,pz,R)[id]);return;}
if(id===BLOCK.CRYSTAL){applyToMesh(Game.crystalMesh,scanTypes([id],px,pz,R)[id]);return;}
const mesh=BLOCK_MESHES.get(id);
if(!mesh)return;
applyToMesh(mesh,scanTypes([id],px,pz,R)[id]);
}
function rebuildDirty(){
if(Game.dirtyTypes.size===0)return;
const t=Game.dirtyTypes;Game.dirtyTypes=new Set();
t.forEach(id=>rebuildType(id));
}
function rebuildFull(){
const px=Math.floor(Game.player.x),pz=Math.floor(Game.player.z);
const R=RENDER_DIST*CHUNK_SIZE+6;
const all=Object.keys(COLORS).map(Number);
const lists=scanTypes(all,px,pz,R);
BLOCK_MESHES.forEach((mesh,id)=>{if(lists[id])applyToMesh(mesh,lists[id]);});
if(lists[BLOCK.LEAVES])applyToMesh(Game.leafMesh,lists[BLOCK.LEAVES]);
if(lists[BLOCK.WATER])applyToMesh(Game.waterMesh,lists[BLOCK.WATER]);
if(lists[BLOCK.CRYSTAL])applyToMesh(Game.crystalMesh,lists[BLOCK.CRYSTAL]);
Game.meshDirty=false;Game.lastRebuild=performance.now();Game.dirtyTypes.clear();
}

/* ========== 玩家物理 ========== */
function updatePlayer(dt){
const p=Game.player;
const planet=Game.planets[Game.planetId];
const gravity=p.inSpace?0:planet.gravity;
const sin=Math.sin(p.yaw),cos=Math.cos(p.yaw);
let mx=-Game.input.forward*sin+Game.input.right*cos;
let mz=-Game.input.forward*cos-Game.input.right*sin;
const speed=p.inSpace?20:(Game.input.sneak?3.5:6.5);
const inWater=getBlock(Math.floor(p.x),Math.floor(p.y+.5),Math.floor(p.z))===BLOCK.WATER;

if(inWater&&Game.input.jump){p.vy=4.5;Game.input.jump=false;}
else if(Game.input.jump&&p.onGround&&!p.inSpace){p.vy=9.5;p.onGround=false;}
if(Game.input.jump&&p.inSpace){p.vy=7;}

p.vx=lerp(p.vx,mx*speed,.22);
p.vz=lerp(p.vz,mz*speed,.22);
if(!p.inSpace){if(inWater)p.vy-=.5*gravity*dt;else p.vy-=gravity*dt;}
else{p.vy*=.95;if(Game.input.sneak)p.vy-=8*dt;}
p.vy=clamp(p.vy,-38,38);

const nx=p.x+p.vx*dt;if(!collidesAt(nx,p.y,p.z))p.x=nx;else p.vx=0;
const nz=p.z+p.vz*dt;if(!collidesAt(p.x,p.y,nz))p.z=nz;else p.vz=0;
const ny=p.y+p.vy*dt;if(!collidesAt(p.x,ny,p.z)){p.y=ny;if(p.vy<0)p.onGround=false;}else{if(p.vy<0)p.onGround=true;p.vy=0;}
if(p.y<-20)respawnPlayer();
p.inSpace=p.y>80;

if(Math.random()<dt*.04&&p.hunger>0)p.hunger=Math.max(0,p.hunger-.08);
if(p.hunger>15&&p.health<20)p.health=Math.min(20,p.health+dt*.4);
const needsAir=p.inSpace||!planet.hasOxygen;
if(needsAir){p.oxygen=Math.max(0,p.oxygen-dt*(p.inSpace?7:3)*(hasMask?.25:1));
if(p.oxygen<=0){p.health=Math.max(0,p.health-dt*4);if(Math.random()<.04)showToast('⛔ 缺氧窒息中！');}}
else{p.oxygen=Math.min(100,p.oxygen+dt*25);}
if(p.hunger<=0){p.health=Math.max(0,p.health-dt*1.2);if(Math.random()<.04)showToast('😵 饥饿！吃树叶恢复');}
if(p.health<=0)respawnPlayer();
if(p.energy<100)p.energy=Math.min(100,p.energy+dt*1.5);
}

function collidesAt(x,y,z){
const checks=[[x-.3,y,z-.3],[x+.3,y,z-.3],[x-.3,y,z+.3],[x+.3,y,z+.3],[x-.3,y+1.7,z-.3],[x+.3,y+1.7,z+.3]];
for(const[cx,cy,cz]of checks)if(isSolid(getBlock(Math.floor(cx),Math.floor(cy),Math.floor(cz))))return true;
return false;
}
function respawnPlayer(){
const planet=Game.planets[Game.planetId];
const h=getHeight(0,0,planet);
Game.player.x=0;Game.player.y=h+3;Game.player.z=0;
Game.player.vx=Game.player.vy=Game.player.vz=0;
Game.player.health=20;Game.player.hunger=20;Game.player.oxygen=100;Game.player.inSpace=false;

}

/* ========== 交互：挖掘（按住有进度） ========== */
function raycastBlock(maxDist=6.5){
const dir=new THREE.Vector3();Game.camera.getWorldDirection(dir);
const origin=new THREE.Vector3(Game.player.x,Game.player.y+1.6,Game.player.z);
let prev=null;
for(let d=0;d<maxDist;d+=.1){
const p=origin.clone().add(dir.clone().multiplyScalar(d));
const b=getBlock(Math.floor(p.x),Math.floor(p.y),Math.floor(p.z));
if(b!==BLOCK.AIR&&b!==BLOCK.WATER)return{block:b,pos:[Math.floor(p.x),Math.floor(p.y),Math.floor(p.z)],prev:prev?[prev.x,prev.y,prev.z]:null,pos3:p};
prev={x:p.x,y:p.y,z:p.z};
}
return null;
}

let miningTarget=null,miningProgress=0,miningHard=0,miningBlock=0;
const TOOL_REQ={[BLOCK.IRON]:1,[BLOCK.GOLD]:1,[BLOCK.OBSIDIAN]:1,[BLOCK.DIAMOND]:2};
function startMine(){
const r=raycastBlock();
if(!r||r.block===BLOCK.BEDROCK||r.block===BLOCK.LAVA){miningTarget=null;return;}
const req=TOOL_REQ[r.block]||0;
if(req>toolLevel){
if(r.block===BLOCK.DIAMOND)showToast('💎 钻石太硬！需要铁镐');
else if(r.block===BLOCK.OBSIDIAN)showToast('🪨 黑曜石需要石镐');
else showToast('⛏️ 需要更高级的镐子');
miningTarget=null;return;
}
miningTarget=r.pos;
miningBlock=r.block;
miningHard=HARDNESS[r.block]||1.5;
miningProgress=0;
const mult=MINE_MULT[toolLevel]||1;
miningHard/=mult;
el('mineProgress').style.display='block';
}
function updateMining(dt){
if(!miningTarget){el('mineProgress').style.display='none';return;}
// 检查目标是否还在
const[bx,by,bz]=miningTarget;
if(getBlock(bx,by,bz)!==miningBlock||getBlock(bx,by,bz)===BLOCK.AIR){miningTarget=null;el('mineProgress').style.display='none';return;}
miningProgress+=dt;
el('mineFill').style.width=Math.min(100,miningProgress/miningHard*100)+'%';
if(miningProgress>=miningHard){
// 挖掉
setBlock(bx,by,bz,BLOCK.AIR);
spawnBreakParticles(bx+.5,by+.5,bz+.5,COLORS[miningBlock][2]);
// 加入背包
addToInv(miningBlock,1);
if(miningBlock===BLOCK.LEAVES){Game.player.hunger=Math.min(20,Game.player.hunger+2);}
if(!Game.achievements.mine){Game.achievements.mine=true;showToast('🏆 破土动工！挖到的东西都在背包(E)里');}
rebuildDirty();
sfx('break');
miningTarget=null;el('mineProgress').style.display='none';
}
}
function cancelMine(){
miningTarget=null;miningProgress=0;
el('mineProgress').style.display='none';
}

function placeBlock(){
const r=raycastBlock();if(!r||!r.prev)return;
const[bx,by,bz]=r.prev;
const px=Game.player.x,py=Game.player.y+1,pz=Game.player.z;
if(Math.abs(bx+.5-px)<.8&&Math.abs(by+.5-py)<1.8&&Math.abs(bz+.5-pz)<.8)return;
const slot=Game.input.selectedSlot;
const bid=Game.hotbar[slot];
if(!bid||bid===BLOCK.AIR)return;
if(!removeFromInv(bid,1))return;
setBlock(bx,by,bz,bid);
spawnBreakParticles(bx+.5,by+.5,bz+.5,COLORS[bid][2],5);
rebuildDirty();
sfx('place');
}

/* ========== 背包系统 ========== */
function addToInv(bid,count=1){
if(!bid||bid===BLOCK.AIR)return;
const cur=Game.inventory.get(bid)||0;
Game.inventory.set(bid,cur+count);
// 自动放入快捷栏空位
if(!Game.hotbar.includes(bid)){
for(let i=0;i<9;i++){if(!Game.hotbar[i]||Game.hotbar[i]===BLOCK.AIR){Game.hotbar[i]=bid;break;}}
}
Game.lastCountsKey='';
updateInventoryUI();
}
function removeFromInv(bid,count=1){
const cur=Game.inventory.get(bid)||0;
if(cur<count)return false;
if(cur===count)Game.inventory.delete(bid);
else Game.inventory.set(bid,cur-count);
Game.lastCountsKey='';
updateInventoryUI();
return true;
}
function countInInv(bid){return Game.inventory.get(bid)||0}

/* ========== 粒子 ========== */
function spawnBreakParticles(x,y,z,color,count=10){
const mat=new THREE.MeshBasicMaterial({color});
for(let i=0;i<count;i++){
const m=new THREE.Mesh(new THREE.BoxGeometry(.12,.12,.12),mat);
m.position.set(x,y,z);Game.scene.add(m);
Game.particles.push({mesh:m,vel:new THREE.Vector3(rand(-2.5,2.5),rand(2,4.5),rand(-2.5,2.5)),life:.8+rand(0,.3)});
}
}
function updateParticles(dt){
for(let i=Game.particles.length-1;i>=0;i--){
const p=Game.particles[i];p.vel.y-=14*dt;
p.mesh.position.add(p.vel.clone().multiplyScalar(dt));
p.life-=dt;p.mesh.scale.setScalar(Math.max(.05,p.life));
if(p.life<=0){Game.scene.remove(p.mesh);Game.particles.splice(i,1);}
}
}

/* ========== 音效 ========== */
function sfx(type){
try{
const ctx=Game.audio||(Game.audio=new(window.AudioContext||window.webkitAudioContext)());
const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);
o.type='square';
if(type==='break'){o.frequency.value=rand(170,210);g.gain.setValueAtTime(.1,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.1);}

}

/* ========== 天空更新 ========== */
function updateSky(dt){
Game.dayTime+=Game.daySpeed*dt;
if(Game.dayTime>1)Game.dayTime-=1;
const t=Game.dayTime;
const sa=t*TAU;
Game.sun.position.set(Math.cos(sa)*100,Math.sin(sa)*100,30);
Game.moonMesh.position.set(-Math.cos(sa)*90,Math.sin(sa)*30-20,-120);
let top,bot,hor,amb;
if(t<.25){top=new THREE.Color('#4a9eff');bot=new THREE.Color('#87ceeb');hor=new THREE.Color('#ffdf80');amb=.8;}
else if(t<.5){top=new THREE.Color('#ff6b3d');bot=new THREE.Color('#ff9966');hor=new THREE.Color('#ffcc66');amb=.5;}
else if(t<.75){top=new THREE.Color('#0a1a3a');bot=new THREE.Color('#1a0a3a');hor=new THREE.Color('#2a1a5a');amb=.25;}
else{top=new THREE.Color('#5a3a8a');bot=new THREE.Color('#ff8866');hor=new THREE.Color('#ffaaff');amb=.5;}
const tc=new THREE.Color(Game.planets[Game.planetId].theme);
top.lerp(tc,.12);bot.lerp(tc,.08);hor.lerp(tc,.2);
Game.skyDome.material.uniforms.top.value=top;Game.skyDome.material.uniforms.bot.value=bot;Game.skyDome.material.uniforms.hor.value=hor;
Game.sun.intensity=clamp(Math.sin(sa)+.3,0,1.2);
Game.scene.children.forEach(c=>{if(c.isAmbientLight)c.intensity=amb;});
Game.renderer.setClearColor(top);
if(Math.random()<dt*.25)spawnShootingStar();
for(let i=Game.shootingStars.length-1;i>=0;i--){const s=Game.shootingStars[i];s.mesh.position.add(s.vel.clone().multiplyScalar(dt));s.life-=dt;if(s.life<=0){Game.scene.remove(s.mesh);Game.shootingStars.splice(i,1);}}
Game.clouds.forEach(c=>{c.position.x+=c.userData.sp*dt;if(c.position.x>Game.player.x+150)c.position.x-=300;});
if(Game.distPlanets)Game.distPlanets.children.forEach(p=>p.rotation.y+=p.userData.rs);
Game.waterMesh.material.opacity=.6+.1*Math.sin(performance.now()*.001);
}

function effectDone(effect){
if(effect==='ship')return shipCrafted;
if(effect==='fuel')return fuelCrafted;
if(effect==='mask')return hasMask;
if(effect==='pickaxe_stone')return toolLevel>=1;
if(effect==='pickaxe_iron')return toolLevel>=2;
return false;
}
window.__craft=function(i){
const rc=RECIPES[i];
for(const[bid,cnt]of Object.entries(rc.mats)){
if(!removeFromInv(+bid,cnt)){showToast('材料不足');return;}
}
if(rc.effect==='ship'){shipCrafted=true;showToast('🚀 飞船核心合成成功！');

if(rc.effect==='mask'){hasMask=true;showToast('🛡️ 氧气面罩装备完成！');}
if(rc.effect==='pickaxe_stone'){toolLevel=1;showToast('🧱 石镐获得，挖矿速度提升！');}
if(rc.effect==='pickaxe_iron'){toolLevel=2;showToast('⚙️ 铁镐获得，钻石唾手可得！');}
sfx('place');
updateInventoryUI();
};

let launchStage=0,launchTimer=0;
function startLaunch(){
if(Game.launching)return;
if(!shipCrafted){showToast('🚀 缺少飞船核心！在背包中合成');toggleInventory(true);return;}
if(!fuelCrafted){showToast('⛽ 缺少曲速燃料！在背包中合成');toggleInventory(true);return;}
Game.launching=true;launchStage=1;launchTimer=0;
el('launchOverlay').classList.add('show');
el('launchCount').textContent='3';
el('launchText').textContent='🚀 飞船发射准备中...';
}
function updateLaunch(dt){
if(!Game.launching)return;
launchTimer+=dt;
if(launchStage<=3){
if(launchTimer>=1){launchTimer=0;launchStage++;
if(launchStage<=3){el('launchCount').textContent=4-launchStage;
if(launchStage===3)el('launchText').textContent='🌌 空间跳跃中...';}
}
return;
}
if(launchStage===4){
// 传送
Game.planetId=(Game.planetId+1)%Game.planets.length;
Game.world.clear();Game.chunks.clear();Game.pendingChunks=[];
fuelCrafted=false;
const planet=Game.planets[Game.planetId];
const h=getHeight(0,0,planet);
Game.player.x=0;Game.player.y=h+4;Game.player.z=0;Game.player.inSpace=false;Game.player.oxygen=100;Game.player.health=Game.player.hunger=20;
Game.scene.fog.color.set(planet.theme);
Game.lastPCX=null;Game.lastPCZ=null;
requestChunks();
for(let i=0;i<30;i++)streamChunks(30);
clearSpawn();
rebuildFull();
launchStage=5;launchTimer=0;
el('launchCount').textContent='✔';
el('launchText').textContent='✅ 抵达 '+planet.name+'！';
}
if(launchStage===5&&launchTimer>=2){
Game.launching=false;
el('launchOverlay').classList.remove('show');
showToast('🌍 欢迎来到 '+Game.planets[Game.planetId].name+'！');
Game.meshDirty=true;
}
}

/* ========== 触摸控制 ========== */
let joyTouch=null,joyCenter={x:0,y:0};
let lookTouch=null,lastLook={x:0,y:0};
const JOY_R=52,DEAD=12;
function initTouch(){
if(!IS_MOBILE)return;
document.querySelector('.touch-controls').classList.add('on');
el('hotbar').classList.add('raised');
const js=el('joystick'),stick=el('joystickStick'),look=el('lookArea');
js.addEventListener('touchstart',e=>{e.preventDefault();const t=e.changedTouches[0];joyTouch=t.identifier;const r=js.getBoundingClientRect();joyCenter={x:r.left+r.width/2,y:r.top+r.height/2};stick.style.touchAction='none';},{passive:false});
js.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches){if(t.identifier!==joyTouch)continue;
let dx=t.clientX-joyCenter.x,dy=t.clientY-joyCenter.y;
const len=Math.hypot(dx,dy);
if(len>JOY_R){dx=dx/len*JOY_R;dy=dy/len*JOY_R;}
const norm=(len<DEAD)?[0,0]:[dx/JOY_R,dy/JOY_R];
Game.input.right=norm[0];Game.input.forward=-norm[1];
stick.style.transform='translate(calc(-50% + '+dx+'px),calc(-50% + '+dy+'px))';
}},{passive:false});
js.addEventListener('touchend',e=>{for(const t of e.changedTouches){if(t.identifier===joyTouch){joyTouch=null;Game.input.right=0;Game.input.forward=0;stick.style.transform='translate(-50%,-50%)';}}},{passive:false});
js.addEventListener('touchcancel',e=>{joyTouch=null;Game.input.right=0;Game.input.forward=0;stick.style.transform='translate(-50%,-50%)';},{passive:false});

// 视角区域：拖拽转向
look.addEventListener('touchstart',e=>{e.preventDefault();const t=e.changedTouches[0];lookTouch=t.identifier;lastLook={x:t.clientX,y:t.clientY};},{passive:false});
look.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches){if(t.identifier!==lookTouch)continue;
const dx=t.clientX-lastLook.x,dy=t.clientY-lastLook.y;
Game.player.yaw-=dx*.0045;
Game.player.pitch=clamp(Game.player.pitch-dy*.0045,-1.45,1.45);
lastLook={x:t.clientX,y:t.clientY};
}},{passive:false});
look.addEventListener('touchend',e=>{for(const t of e.changedTouches)if(t.identifier===lookTouch)lookTouch=null;},{passive:false});

el('btnJump').addEventListener('touchstart',e=>{e.preventDefault();Game.input.jump=true;});
el('btnJump').addEventListener('touchend',e=>{e.preventDefault();Game.input.jump=false;});
// 挖掘：按住持续挖
el('btnBreak').addEventListener('touchstart',e=>{e.preventDefault();Game.input.breakHold=true;startMine();},{passive:false});
el('btnBreak').addEventListener('touchend',e=>{e.preventDefault();Game.input.breakHold=false;cancelMine();},{passive:false});
el('btnPlace').addEventListener('touchstart',e=>{e.preventDefault();placeBlock();},{passive:false});
el('btnInv').addEventListener('touchstart',e=>{e.preventDefault();toggleInventory();},{passive:false});
}

el('hudInvBtn').addEventListener('click',()=>toggleInventory());
el('planetBtn').addEventListener('click',startLaunch);
el('planetInfo').addEventListener('click',()=>{showToast('🌍 当前星球：'+Game.planets[Game.planetId].name);});
document.addEventListener('keydown',e=>{if(e.code==='Escape'){if(el('invScreen').classList.contains('open'))toggleInventory(false);else if(Game.started&&!Game.paused){Game.paused=true;el('pauseMenu').classList.remove('hidden');}}});
}
function initSkyPlaceholder(){/* 天空在 initSky 中创建 */}

/* ========== 生成世界（首次） ========== */
function generatePlanetWorld(){
const pcx=chunkCoord(Game.player.x),pcz=chunkCoord(Game.player.z);
for(let dx=-RENDER_DIST;dx<=RENDER_DIST;dx++)for(let dz=-RENDER_DIST;dz<=RENDER_DIST;dz++){
generateChunk(pcx+dx,pcz+dz);
}
clearSpawn();
Game.meshDirty=false;
rebuildFull();
el('loadingScreen').classList.add('hidden');
Game.ready=true;
Game.lastTime=performance.now();
showToast('🌍 已抵达 地球 — 收集资源，挖到钻石！');
initMouseLook();
}
/* ========== 鼠标视角（启动后） ========== */
function initMouseLook(){
if(!IS_MOBILE)el('gameCanvas').addEventListener('click',()=>{if(Game.started&&!Game.paused)el('gameCanvas').requestPointerLock&&el('gameCanvas').requestPointerLock();});
}

/* ========== Toast ========== */
let toastTimeout=null;
function showToast(msg){
const t=el('eventToast');
t.textContent=msg;t.classList.add('show');
if(toastTimeout)clearTimeout(toastTimeout);
toastTimeout=setTimeout(()=>t.classList.remove('show'),3200);
}

/* ========== 主循环 ========== */
function gameLoop(time){
if(!Game.started||!Game.ready||Game.paused){
Game.lastTime=time;
requestAnimationFrame(gameLoop);
return;
}
const dt=Math.min((time-Game.lastTime)/1000,.05);
Game.lastTime=time;

// 处理输入
if(Game.input.breakHold&&!miningTarget)startMine();
if(Game.input.mouseDown&&!miningTarget)startMine();

// 物理
updatePlayer(dt);
updateCamera();
updateMining(dt);
updateParticles(dt);
updateSky(dt);
updateLaunch(dt);
updateHUD();
updateHotbar();

// 区块流：跨区块时请求新区块
const pcx=chunkCoord(Game.player.x),pcz=chunkCoord(Game.player.z);
if(pcx!==Game.lastPCX||pcz!==Game.lastPCZ){requestChunks();Game.lastPCX=pcx;Game.lastPCZ=pcz;}
streamChunks(IS_MOBILE?2:5);
Game.cleanupTimer+=dt;
if(Game.cleanupTimer>5){cleanupWorld();Game.cleanupTimer=0;}

// 网格重建：方块变化用增量（快），区块生成用全量（节流）
if(Game.pendingChunks.length===0&&time-Game.lastRebuild>150)rebuildDirty();
if(Game.meshDirty&&time-Game.lastRebuild>400){
rebuildFull();
}

// 渲染
Game.renderer.render(Game.scene,Game.camera);
requestAnimationFrame(gameLoop);
}

/* ========== 初始化 ========== */
function init(){
initRenderer();
initBlockMeshes();
initSky();
initKeyboard();
initTouch();
bindStaticUI();
// 星球按钮默认隐藏，合成飞船后显示
el('planetBtn').style.display='none';
Game.meshDirty=true;
// 启动循环
requestAnimationFrame(gameLoop);
}
init();
</script>
